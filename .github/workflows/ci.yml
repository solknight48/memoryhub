name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run on demand: gh workflow run ci, or the Actions tab

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1  # no floating major tag on this action
        with:
          python-version: ${{ matrix.python }}
      # the relay tests drive a real tmux server (Linux-only feature; the
      # tests skip wherever the binary is missing, e.g. the macOS image)
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y tmux
      - run: uv run --locked pytest -q
