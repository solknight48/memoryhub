<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>mh — checkpoint map</title>
<style>
/* HEY-inspired: warm cream canvas, white cards, HEY purple, mint pills,
   bright avatar circles, big friendly type. */
:root {
  color-scheme: light;
  --surface-1: #ffffff;
  --page: #faf6f0;
  --text-primary: #161310;
  --text-secondary: #57524b;
  --muted: #8d867c;
  --grid: #efe8dd;
  --baseline: #d9d0c2;
  --border: rgba(22, 19, 16, 0.08);
  --accent: #5522fa;
  --accent-soft: #f1ecff;
  --mint: #b9f0d3;
  --mint-ink: #0b3d24;
  --neutral-mark: #b3aa9d;
  --critical: #d03b3b;
  --good: #0a7d43;
  --avatar-ink: #161310;
  /* code tokens: readable on the cream page, same roles in both themes */
  --c-comment: #8d867c;
  --c-string: #0a7d43;
  --c-key: #7a2fd6;
  --c-num: #b45309;
  --c-func: #1f6feb;
  --c-type: #8a6d00;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-1: #211d18;
    --page: #141110;
    --text-primary: #f7f4ef;
    --text-secondary: #c9c2b8;
    --muted: #8d867c;
    --grid: #35302a;
    --baseline: #48413a;
    --border: rgba(247, 244, 239, 0.10);
    --accent: #9d8cff;
    --accent-soft: #2a2440;
    --mint: #1f4d36;
    --mint-ink: #b9f0d3;
    --neutral-mark: #6a635a;
    --critical: #e0655a;
    --good: #39c47a;
    --c-comment: #8d867c;
    --c-string: #9cd67f;
    --c-key: #d59bf6;
    --c-num: #f2a35e;
    --c-func: #7fc3f5;
    --c-type: #f5d652;
  }
}
* { box-sizing: border-box; }
/* class rules that set `display` outbid the UA's [hidden] rule, so the
   attribute silently stops working — .badge did exactly that to #robadge. */
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 14px 24px; background: var(--page);
}
header h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
header .hub { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
.spacer { flex: 1; }
main { padding: 8px 24px 28px; max-width: 1100px; margin: 0 auto; }
.tagline { text-align: center; color: var(--text-secondary); font-size: 14px; margin: 4px 0 18px; }
/* ?view=<sid>: a page for one transcript, opened from "open original". Only
   the live panel, pinned to that session for good, full output, every
   exchange — the map, its controls and the session-switching are not here. */
body.viewonly main > section:not(#livesec), body.viewonly .tagline,
body.viewonly #budget, body.viewonly #budget-label, body.viewonly #newckpt, body.viewonly #tmpl,
body.viewonly #reload, body.viewonly #golive, body.viewonly #live-follow, body.viewonly #live-newest,
body.viewonly #current { display: none !important; }
section {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 20px; padding: 22px 24px; margin-bottom: 22px;
  box-shadow: 0 1px 2px rgba(20, 15, 5, 0.03), 0 12px 32px -28px rgba(20, 15, 5, 0.35);
}
h2 { font-size: 17px; margin: 0 0 14px; font-weight: 800; color: var(--text-primary);
     letter-spacing: -0.01em; }
.mapwrap { overflow-x: auto; }
svg { display: block; }
svg text { font: 11px system-ui, sans-serif; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px;
          font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
button {
  font: inherit; font-size: 12.5px; font-weight: 650; padding: 6px 14px;
  border-radius: 999px; border: 1px solid var(--baseline);
  background: var(--surface-1); color: var(--text-primary); cursor: pointer;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
button.danger:hover { border-color: var(--critical); color: var(--critical); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { color: #fff; opacity: 0.92; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:disabled:hover { border-color: var(--baseline); color: var(--text-primary); }
button.primary:disabled:hover { color: #fff; }
textarea:disabled { opacity: 0.6; }
button.mint { background: var(--mint); border-color: transparent; color: var(--mint-ink); font-weight: 700; }
button.mint:hover { color: var(--mint-ink); opacity: 0.88; }
input[type=number], textarea {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--baseline); background: var(--surface-1); color: var(--text-primary);
  width: 100%;
}
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
           line-height: 1.55; resize: vertical; min-height: 90px; border-radius: 12px; }
/* sessions as a Screener-style list: bright avatar circle, bold title with a
   ‹key›, then one gray line of meta — preview */
.srow { display: flex; align-items: flex-start; gap: 14px; padding: 14px 12px;
        border-top: 1px solid var(--grid); cursor: pointer; border-radius: 14px; }
.srow:first-child { border-top: 0; }
.srow:hover { background: var(--accent-soft); }
.srow:hover + .srow { border-top-color: transparent; }
.avatar { width: 44px; height: 44px; border-radius: 50%; flex: none;
          display: flex; align-items: center; justify-content: center;
          font-weight: 800; font-size: 14px; color: var(--avatar-ink); }
.smain { flex: 1; min-width: 0; }
.stitle { font-weight: 750; font-size: 14.5px; }
.stitle .skey { color: var(--muted); font-weight: 500; font-size: 12.5px;
               font-family: ui-monospace, monospace; margin-left: 4px; }
.spreview { color: var(--text-secondary); font-size: 13px; line-height: 1.45; margin-top: 3px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sacts { display: flex; gap: 8px; flex: none; align-self: center; }
.badge { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
         border: 1px solid var(--border); color: var(--text-secondary); margin-left: 6px; }
.badge.warn { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.ex { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.ex header { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
             background: var(--page); border: 0; border-bottom: 1px solid var(--border); }
.ex .role { font-size: 11px; font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
/* one turn = one readable column: prose face, capped measure, role color-coded */
.turn { padding: 12px 16px; }
.turn.user { background: color-mix(in srgb, var(--accent) 5%, transparent);
             border-left: 3px solid var(--accent); }
.turn.agent { border-left: 3px solid var(--grid); border-top: 1px solid var(--grid); }
.rolechip { display: inline-block; font-size: 10.5px; font-weight: 650; letter-spacing: 0.04em;
            text-transform: uppercase; padding: 1px 8px; border-radius: 999px; margin-bottom: 8px; }
.rolechip.user { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.rolechip.agent { color: var(--text-secondary); background: color-mix(in srgb, var(--muted) 18%, transparent); }
.modelchip { display: inline-flex; align-items: center; vertical-align: middle; gap: 5px;
             font-size: 10.5px; font-weight: 600; padding: 2px 9px 2px 7px;
             border-radius: 999px; margin: 0 0 8px 6px; color: var(--text-secondary);
             border: 1px solid var(--baseline); }
.modelchip i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.md { font: 13.5px/1.65 system-ui, sans-serif; }
.md p { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: break-word; max-width: 76ch; }
.md p:last-child, .md ul:last-child, .md ol:last-child, .md pre:last-child,
.md .md-table:last-child { margin-bottom: 0; }
.md pre { background: var(--page); border: 1px solid var(--grid); border-radius: 8px;
          padding: 10px 12px; margin: 0 0 10px; overflow-x: auto; }
.md pre code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: none; padding: 0; }
/* the highlighter's six roles; anything it is unsure of stays plain text */
pre .c { color: var(--c-comment); font-style: italic; }
pre .s { color: var(--c-string); }
pre .k { color: var(--c-key); font-weight: 600; }
pre .n { color: var(--c-num); }
pre .f { color: var(--c-func); }
pre .t { color: var(--c-type); }
.md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em;
           background: color-mix(in srgb, var(--accent) 8%, transparent);
           padding: 1px 4px; border-radius: 4px; overflow-wrap: break-word; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; max-width: 72ch; }
.md li { margin: 2px 0; white-space: pre-wrap; overflow-wrap: break-word; }
.md .md-h1, .md .md-h2, .md .md-h3, .md .md-h4 { font-weight: 650; margin: 14px 0 6px; }
.md .md-h1 { font-size: 15px; } .md .md-h2 { font-size: 14px; }
.md .md-h3 { font-size: 13.5px; } .md .md-h4 { font-size: 13px; color: var(--text-secondary); }
.md hr { border: 0; border-top: 1px solid var(--grid); margin: 12px 0; }
.md .quote { border-left: 3px solid var(--baseline); padding-left: 10px; margin: 0 0 10px;
             color: var(--text-secondary); white-space: pre-wrap; max-width: 74ch; }
.md a { color: var(--accent); overflow-wrap: break-word; }
.md .md-table { overflow-x: auto; margin: 0 0 10px; }
.md table { border-collapse: collapse; width: max-content; min-width: 100%;
            font-size: 12.5px; font-variant-numeric: tabular-nums; }
.md th, .md td { text-align: left; vertical-align: top;
                 padding: 6px 18px 6px 0; overflow-wrap: break-word; }
.md th:last-child, .md td:last-child { padding-right: 0; }
.md th { font-weight: 650; white-space: nowrap; border-bottom: 2px solid var(--baseline); }
.md td { border-bottom: 1px solid var(--grid); }
.md tbody tr:last-child td { border-bottom: 0; }
.rawpre { white-space: pre-wrap; overflow-wrap: break-word; margin: 0;
          font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 8px 0; font-style: italic; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  padding: 9px 16px; border-radius: 8px; font-size: 13px; color: #fff;
  background: #333; opacity: 0; pointer-events: none; transition: opacity .18s; max-width: 90vw;
}
#toast.show { opacity: 1; }
#toast.err { background: var(--critical); }
#toast.ok { background: var(--good); }
#tip {
  position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface-1); border: 1px solid var(--baseline); border-radius: 6px;
  padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 9;
}
#tip.show { opacity: 1; }
#menu {
  position: fixed; z-index: 10; background: var(--surface-1);
  border: 1px solid var(--baseline); border-radius: 14px; padding: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.22); min-width: 160px; max-height: 60vh; overflow-y: auto;
}
/* the live session: a green pulse while the page is following the transcript */
.livedot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
           background: var(--good); margin-left: 8px; vertical-align: middle;
           animation: pulse 2.2s ease-in-out infinite; }
.livedot.off { background: var(--neutral-mark); animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
.ex.dropped { opacity: 0.55; }
.droppreview { padding: 11px 16px; color: var(--text-secondary);
               text-decoration: line-through; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
/* the unfiltered stream: one block per thing the agent emitted */
.part { border-top: 1px dashed var(--grid); padding: 9px 0 1px; }
.part:first-child { border-top: 0; padding-top: 0; }
.partchip { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
            text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.part.think .md { color: var(--text-secondary); }
/* marker | name | argument, as three columns: a command long enough to wrap
   (a path, a URL) keeps its later lines under the argument instead of falling
   back to the container edge, where it reads as a new call */
.tool summary { cursor: pointer; list-style: none; display: flex; gap: 7px;
                     font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
                     color: var(--text-secondary); }
.tool summary::-webkit-details-marker { display: none; }
.tool summary::before { content: "▸"; color: var(--muted); flex: none; }
.tool[open] summary::before { content: "▾"; }
.tool summary .toolname { flex: none; color: var(--accent); font-weight: 700; }
.tool summary .toolname::after { content: " —"; color: var(--muted); font-weight: 400; }
/* break-word, never `anywhere`: a path or URL wraps whole to the next line and
   only splits when it cannot fit on a line at all. `anywhere` chops mid-token
   ("/tmp/mh-ui-" / "7777.log"), which reads as a broken link. */
.tool summary .toolarg { min-width: 0; overflow-wrap: break-word; }
.tool summary .badge { flex: none; align-self: center; }
.tool pre { background: var(--page); border: 1px solid var(--grid); border-radius: 8px;
                 padding: 8px 10px; margin: 6px 0 0; overflow-x: auto;
                 font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
/* one reply asking for several tools: they ran together, so they read as one
   step with an accent rail, not as N adjacent steps */
.part.batch { border-left: 2px solid var(--accent); padding-left: 11px; }
.batchhead { font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
             text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.batchhead::before { content: "⇉ "; }
.part.batch .part { border-top: 0; padding: 1px 0; }
.clip { color: var(--muted); font-size: 11px; font-style: italic; }
/* a picture in the session: pasted with a question, or a screenshot the agent
   read. Shown small, the full size one click away, served by mh itself */
.shot { display: block; max-width: 100%; max-height: 360px; border-radius: 10px;
        border: 1px solid var(--grid); margin: 8px 0 4px; background: var(--page); }
.shotlink { display: inline-block; max-width: 100%; }
/* type back into the session: a paste into its terminal, not a fake reply.
   It sits under the dialog like a chat box and stays pinned to the bottom of
   the window while the live section is in view, so the newest exchange and
   the place to answer it are never a scroll apart. Sticky, not fixed: it
   scrolls away with its section instead of covering the map below. */
.composer { position: sticky; bottom: 12px; border: 1px solid var(--baseline);
            border-radius: 14px; padding: 10px 12px; background: var(--page);
            box-shadow: 0 1px 2px rgba(20, 15, 5, 0.04),
                        0 -10px 24px -18px rgba(20, 15, 5, 0.45); }
.composer textarea { border: 0; background: transparent; padding: 0; min-height: 52px;
                     font: 13.5px/1.55 system-ui, sans-serif; }
.composer textarea:focus { outline: none; }
.composer .to { font-size: 12px; color: var(--muted); flex: 1; min-width: 0;
                overflow-wrap: anywhere; }
.composer .to.off { color: var(--critical); }
/* Claude Code's per-project auto-memory, shown read-only beside the map: one
   card per note, its markdown body, the notes it links to, and the session it
   came from. mh does not own this folder and never writes it. */
.memcard { border: 1px solid var(--grid); border-radius: 12px; padding: 12px 14px;
           margin-bottom: 10px; background: var(--surface-1); scroll-margin-top: 16px; }
.memcard.flash { animation: memflash 1.2s ease-out; }
@keyframes memflash { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: none; } }
.memcard > header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
                    margin-bottom: 6px; }
.memcard .mtitle { font-weight: 650; }
.memcard .mname { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.mtype { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
         padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.mtype.feedback { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.mtype.reference { background: color-mix(in srgb, #b45309 18%, transparent); color: #b45309; }
.mtype.user { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
.memcard .md { font-size: 13px; }
.memcard .mrel { margin-top: 8px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
                 font-size: 12px; color: var(--muted); }
.memchip { border: 1px solid var(--baseline); border-radius: 999px; padding: 1px 9px;
           font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer;
           background: transparent; color: var(--text-secondary); }
.memchip:hover { border-color: var(--accent); color: var(--accent); }
.memchip.missing { cursor: default; opacity: 0.6; text-decoration: line-through; }
.memchip.missing:hover { border-color: var(--baseline); color: var(--text-secondary); }
.prov { font-size: 12px; color: var(--text-secondary); margin: -4px 0 12px;
        display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.prov code { font-size: 11.5px; }
.linklike { border: 0; background: transparent; color: var(--accent); cursor: pointer;
            padding: 0; font: inherit; text-decoration: underline; }
.linklike:hover { opacity: 0.8; }
/* the box's projection of the CLI: a message that starts with "/" brings up
   the session's own skills and commands (read from disk by mh) and, behind
   /model, its models. Picking one composes the text here; the CLI runs it as
   if typed at its prompt. It grows upward from the message box, since the
   composer sits at the bottom of the window. */
.palette { border: 1px solid var(--baseline); border-radius: 10px; background: var(--surface-1);
           margin-bottom: 8px; max-height: 260px; overflow: auto; overscroll-behavior: contain; }
.palette .phead { font-size: 11px; color: var(--muted); padding: 6px 10px 4px;
                  position: sticky; top: 0; background: var(--surface-1); }
.palette .pitem { display: flex; gap: 10px; align-items: baseline; padding: 5px 10px;
                  cursor: pointer; }
.palette .pitem.sel, .palette .pitem:hover { background: var(--accent-soft); }
.palette .pname { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  white-space: nowrap; }
.palette .phint { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  color: var(--muted); white-space: nowrap; }
.palette .pdesc { font-size: 12px; color: var(--text-secondary); flex: 1; min-width: 0;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette .pkind { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
                  color: var(--muted); white-space: nowrap; }
.palette .pempty { padding: 6px 10px 8px; font-size: 12px; color: var(--muted); }
.liverow { margin-bottom: 12px; }
.liverow label { font-size: 12px; }
#menu .menu-label { font-size: 11px; color: var(--muted); padding: 2px 8px 6px; }
#menu .askfield { display: block; width: 260px; margin: 2px 0 0; padding: 7px 12px; font: inherit;
                  font-size: 13px; border-radius: 10px; border: 1px solid var(--baseline);
                  background: var(--surface-1); color: var(--text-primary); }
#menu .askfield:focus { outline: none; border-color: var(--accent); }
/* the feed shows the newest exchanges; the rest is one click away, not a scroll */
.earlier { display: block; width: 100%; margin: 0 0 14px; border-style: dashed;
           color: var(--text-secondary); }
#menu button { display: block; width: 100%; text-align: left; border: 0;
               background: transparent; padding: 6px 10px; border-radius: 8px; }
#menu button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
#menu button[disabled] { color: var(--muted); cursor: default; }
#menu button[disabled]:hover { background: transparent; }
</style>
</head>
<body>
<header>
  <h1>mh — checkpoint map</h1>
  <span class="badge warn" id="robadge" hidden>read-only</span>
  <span class="hub" id="hubpath"></span>
  <span class="muted" id="current" style="font-size:12px"></span>
  <span class="spacer"></span>
  <button id="golive" hidden title="Jump to the session running right now">● live session</button>
  <label class="muted" id="budget-label" style="font-size:12px" title="Token budget for the next mh load — the map marks the sessions that fit">budget
    <input type="number" id="budget" min="0" step="500"
           style="width:90px;display:inline-block;margin-left:6px">
  </label>
  <button id="tmpl" title="Stage template: default names for the checkpoints ahead">template ▾</button>
  <button id="newckpt" class="mint">+ checkpoint</button>
  <button id="reload">refresh</button>
</header>

<main>
  <p class="tagline">Everything your sessions learned, one checkpoint at a time.</p>
  <section>
    <h2>Timeline</h2>
    <div class="mapwrap"><svg id="map" role="img" aria-label="Checkpoint timeline"></svg></div>
    <div class="legend">
      <span><i class="key" style="background:var(--accent)"></i> in the next <code>mh load</code></span>
      <span><i class="key" style="background:var(--neutral-mark)"></i> not loaded</span>
      <span><i class="key" style="background:transparent;border:2px solid var(--text-primary)"></i> current pointer</span>
      <span id="legend-ahead" hidden><i class="key" style="background:transparent;border:2px dashed var(--muted)"></i> stage ahead (template)</span>

<script id="mh-config" type="application/json">{}</script>
<script>
const PARAMS = new URLSearchParams(location.search);
const TOKEN = PARAMS.get("t") || "";
const $ = (id) => document.getElementById(id);
// Server-injected config; the empty-object fallback keeps the page sane if it
// is ever opened as a plain file.
const CFG = { budget: 20000, readOnly: false, hub: "", version: "",
              ...JSON.parse($("mh-config").textContent || "{}") };
const RO = !!CFG.readOnly;
let DATA = null, SEL_CK = null;

function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show " + (kind || "");
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = ""), kind === "err" ? 6000 : 3200);
}

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { "X-Mh-Token": TOKEN, "Content-Type": "application/json" },
  });
  const data = await res.json().catch(() => ({ error: "bad response" }));
  if (!res.ok) {
    // a failed git call sends its first stderr line along; that is the fix
    const detail = typeof data.detail === "string" && data.detail.trim()
      ? " — " + data.detail.trim().split("\n")[0] : "";
    throw new Error((data.error || ("HTTP " + res.status)) + detail);
  }
  return data;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

// Every mutation is the same shape: POST, report, re-read the hub, maybe reopen a
// pane. Written out per call site it drifted — one site had no catch at all.
async function act(path, body, okMsg, after) {
  try {
    const r = await post(path, body);
    toast(typeof okMsg === "function" ? okMsg(r) : okMsg, "ok");
    await refresh();
    if (after) after(r);
  } catch (e) { toast(e.message, "err"); }
}

// a small anchored popover of choices — click one, or dismiss with Esc /
// a click anywhere else (typing a slug into prompt() was a typo machine)
function closeMenu() {
  const m = $("menu");
  if (m) m.remove();
  removeEventListener("click", onMenuDismiss, true);
  removeEventListener("keydown", onMenuKey, true);
}
function onMenuDismiss(e) {
  const m = $("menu");
  if (m && !m.contains(e.target)) closeMenu();
}
function onMenuKey(e) { if (e.key === "Escape") closeMenu(); }
function openMenu(m, anchor) {
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + "px";
  setTimeout(() => {  // defer, or the opening click dismisses it instantly
    addEventListener("click", onMenuDismiss, true);
    addEventListener("keydown", onMenuKey, true);
  }, 0);
}
function menu(anchor, label, options, emptyMsg, onPick) {
  closeMenu();
  if (!options.length) { toast(emptyMsg, "err"); return; }
  const m = el("div", { id: "menu" }, el("div", { class: "menu-label", text: label }));
  options.forEach((o) => m.appendChild(el("button", { text: o, onclick: (e) => {
    e.stopPropagation(); closeMenu(); onPick(o);
  } })));
  openMenu(m, anchor);
}
// the same popover with one text field, for the two places that need a name
// typed — prompt() blocks the page, matches nothing on it, and cannot be
// driven by an agent's browser
function ask(anchor, label, initial, onSubmit) {
  closeMenu();
  const field = el("input", { type: "text", class: "askfield", value: initial || "",
                              placeholder: "letters and digits of any script" });
  const submit = () => {
    const v = field.value.trim();
    if (!v || v === initial) { closeMenu(); return; }
    closeMenu(); onSubmit(v);
  };
  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
  const m = el("div", { id: "menu" },
    el("div", { class: "menu-label", text: label }), field,
    el("div", { class: "row end", style: "margin-top:8px" },
      el("button", { text: "cancel", onclick: (e) => { e.stopPropagation(); closeMenu(); } }),
      el("button", { class: "primary", text: "ok", onclick: (e) => { e.stopPropagation(); submit(); } })));
  openMenu(m, anchor);
  field.focus();
  field.select();
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;      // all user data goes through here
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) n.appendChild(kid);
  return n;
}
const svg = (tag, props) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  return n;
};

// --- markdown-lite, built entirely from DOM nodes (never innerHTML) --------
// Dialog is markdown; showing it raw made every session a wall of asterisks.
// This renders the safe common subset — fences, headings, lists, quotes,
// `code`, **bold**, links — and leaves anything else exactly as typed.

// http(s) only — nothing else can become an href, so no scheme is smuggled in
// through dialog. The page already sends no referrer, and every link opens in
// its own tab with no handle back to this one.
const link = (text, href) =>
  el("a", { text, href, target: "_blank", rel: "noopener noreferrer" });

// Where a bare URL really ends. Sentence punctuation after it is prose, and so
// is a closing bracket that never opened inside the URL — but a URL may
// legitimately carry balanced ones, so those stay.
function urlEnd(url) {
  const pairs = { ")": "(", "]": "[", "}": "{" };
  let end = url.length;
  while (end > 0) {
    const ch = url[end - 1];
    if (".,;:!?'\"".includes(ch)) { end--; continue; }
    if (pairs[ch]) {
      const head = url.slice(0, end);
      const opened = head.split(pairs[ch]).length - 1;
      const closed = head.split(ch).length - 1;
      if (closed > opened) { end--; continue; }
    }
    break;
  }
  return end;
}

function inline(text) {
  const frag = document.createDocumentFragment();
  // code, bold, [text](url), then a bare URL — in that order, so a URL inside
  // backticks stays code and a markdown link keeps its label
  const re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>"']+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) frag.appendChild(el("code", { text: m[1].slice(1, -1) }));
    else if (m[2]) {
      // recurse: a URL wrapped in bold is still a URL, and mh prints them that way
      const strong = el("strong", {});
      strong.appendChild(inline(m[2].slice(2, -2)));
      frag.appendChild(strong);
    } else if (m[3] !== undefined) frag.appendChild(link(m[3], m[4]));
    else {
      const href = m[5].slice(0, urlEnd(m[5]));
      frag.appendChild(link(href, href));
      re.lastIndex = m.index + href.length;  // hand the punctuation back to prose
    }
    last = re.lastIndex;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

// One row of a pipe table: split on unescaped |, drop the optional outer pipes.
function cells(line) {
  const out = [];
  let cur = "";
  for (let k = 0; k < line.length; k++) {
    if (line[k] === "\\" && line[k + 1] === "|") { cur += "|"; k++; }
    else if (line[k] === "|") { out.push(cur); cur = ""; }
    else cur += line[k];
  }
  out.push(cur);
  if (!out[0].trim()) out.shift();
  if (out.length && !out[out.length - 1].trim()) out.pop();
  return out.map((c) => c.trim());
}

// --- syntax colour, built from DOM nodes like everything else --------------
// A session is mostly code, and a wall of one colour is hard to read. This is
// a deliberately small tokenizer — comments, strings, numbers, keywords, call
// names — not a parser: it colours what is unambiguous and leaves the rest
// alone. No dependency, no innerHTML, and it never alters a character of the
// code: strip the spans and you have the block back byte for byte.

const LANGS = {
  cpp: {
    hash: false,  // '#' starts a preprocessor line here, not a comment
    words: "alignas auto bool break case catch char class const constexpr continue default delete do double else enum explicit extern false float for friend goto if inline int long mutable namespace new noexcept nullptr operator private protected public return short signed sizeof static struct switch template this throw true try typedef typename union unsigned using virtual void volatile while",
  },
  python: {
    hash: true,
    words: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return self True try while with yield",
  },
  js: {
    hash: false,
    words: "async await break case catch class const continue default delete do else export extends false finally for from function if import in instanceof let new null of return super switch this throw true try typeof undefined var void while yield",
  },
  shell: {
    hash: true,
    words: "case cd do done echo elif else esac exit export fi for function if in local return set source then unset until while",
  },
  json: { hash: false, words: "true false null" },
  toml: { hash: true, words: "true false" },
  generic: { hash: false, words: "" },
};
const LANG_ALIAS = {
  "c++": "cpp", cc: "cpp", h: "cpp", hpp: "cpp", c: "cpp", rust: "cpp", go: "cpp",
  py: "python", python3: "python",
  javascript: "js", ts: "js", typescript: "js", jsx: "js", tsx: "js",
  sh: "shell", bash: "shell", zsh: "shell", console: "shell", shell: "shell",
  yaml: "toml", yml: "toml", ini: "toml", conf: "toml",
};

// Only on a signal that is hard to mistake; anything else stays generic, which
// colours strings and numbers and claims nothing about the language.
function codeLang(info, text) {
  const tag = (info || "").trim().toLowerCase();
  if (tag) return LANGS[tag] ? tag : (LANG_ALIAS[tag] || "generic");
  if (/#include|std::|->\w+\(|\w+::\w/.test(text)) return "cpp";
  if (/^\s*(def|class)\s+\w+|^\s*(import|from)\s+\w+/m.test(text)) return "python";
  if (/=>|\bfunction\b|\bconst\s+\w+\s*=/.test(text)) return "js";
  if (/^\s*[$#]\s+\S|^#!\/|\b(grep|sed|awk|curl|git|uv run|pytest)\b/m.test(text)) return "shell";
  if (/^\s*[{[][\s\S]*[}\]]\s*$/.test(text) && /"\w+"\s*:/.test(text)) return "json";
  return "generic";
}

const codeRules = {};
function codeRe(lang) {
  if (codeRules[lang]) { codeRules[lang].lastIndex = 0; return codeRules[lang]; }
  const spec = LANGS[lang] || LANGS.generic;
  const comment = spec.hash ? "\\/\\/[^\\n]*|#[^\\n]*" : "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/";
  const re = new RegExp(
    "(" + comment + ")" +                                  // 1 comment
    "|(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*')" +  // 2 string
    "|(\\b\\d[\\w.]*)" +                                   // 3 number
    "|([A-Za-z_][\\w]*)",                                  // 4 word
    "g"
  );
  codeRules[lang] = re;
  return re;
}

function highlight(text, lang) {
  const frag = document.createDocumentFragment();
  const words = new Set((LANGS[lang] || LANGS.generic).words.split(" ").filter(Boolean));
  const re = codeRe(lang);
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) frag.appendChild(el("span", { class: "c", text: m[1] }));
    else if (m[2]) frag.appendChild(el("span", { class: "s", text: m[2] }));
    else if (m[3]) frag.appendChild(el("span", { class: "n", text: m[3] }));
    else {
      const word = m[4], after = text.slice(re.lastIndex);
      // CamelCase only, and never in shell: ALL-CAPS words are as often prose
      // in an ascii diagram as they are constants, and colouring those is noise
      const typish = /^[A-Z][a-z]\w*$/.test(word) && lang !== "generic" && lang !== "shell";
      const cls = words.has(word) ? "k"
                : /^\s*\(/.test(after) ? "f"
                : typish ? "t"
                : "";
      frag.appendChild(cls ? el("span", { class: cls, text: word })
                           : document.createTextNode(word));
    }
    last = re.lastIndex;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

function md(text) {
  const root = el("div", { class: "md" });
  const lines = String(text).split("\n");
  let i = 0, para = [];
  const flushP = () => {
    if (!para.length) return;
    const p = el("p", {});
    p.appendChild(inline(para.join("\n")));
    root.appendChild(p);
    para = [];
  };
  while (i < lines.length) {
    const line = lines[i];
    const f = line.match(/^\s*(```|~~~) *([\w+#.-]*)/);
    if (f) {  // fenced code: verbatim, same token closes (as in curate.py)
      flushP();
      const token = f[1], info = f[2], buf = [];
      i++;
      while (i < lines.length && !lines[i].trimStart().startsWith(token)) { buf.push(lines[i]); i++; }
      if (i < lines.length) i++;  // the closing fence
      const body = buf.join("\n");
      const code = el("code", {});
      code.appendChild(highlight(body, codeLang(info, body)));
      root.appendChild(el("pre", {}, code));
      continue;
    }
    const h = line.match(/^(#{1,4}) +(.*)$/);
    if (h) {
      flushP();
      const d = el("div", { class: "md-h" + h[1].length });
      d.appendChild(inline(h[2]));
      root.appendChild(d);
      i++; continue;
    }
    // a pipe table, only when the second line is a real delimiter row of the
    // same width — otherwise prose with a stray | stays a paragraph
    if (line.includes("|") && i + 1 < lines.length) {
      const head = cells(line), delim = cells(lines[i + 1]);
      if (head.length && head.length === delim.length &&
          delim.every((c) => /^:?-+:?$/.test(c))) {
        flushP();
        const aligns = delim.map((c) => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right")
                                      : c.startsWith(":") ? "left" : null);
        const cellEl = (tag, text, k) => {
          const n = el(tag, aligns[k] ? { style: "text-align:" + aligns[k] } : {});
          n.appendChild(inline(text));
          return n;
        };
        const rowEl = (tag, vals) => {
          const tr = el("tr", {});
          head.forEach((_, k) => tr.appendChild(cellEl(tag, vals[k] || "", k)));
          return tr;
        };
        const table = el("table", {});
        table.appendChild(el("thead", {}, rowEl("th", head)));
        const body = el("tbody", {});
        i += 2;
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
          body.appendChild(rowEl("td", cells(lines[i])));  // short rows pad, long ones clip
          i++;
        }
        table.appendChild(body);
        root.appendChild(el("div", { class: "md-table" }, table));
        continue;
      }
    }
    if (/^\s*-{3,}\s*$/.test(line)) { flushP(); root.appendChild(el("hr")); i++; continue; }
    if (/^> ?/.test(line)) {
      flushP();
      const qb = [];
      while (i < lines.length && /^> ?/.test(lines[i])) { qb.push(lines[i].replace(/^> ?/, "")); i++; }
      const d = el("div", { class: "quote" });
      d.appendChild(inline(qb.join("\n")));
      root.appendChild(d);
      continue;
    }
    const ordered = /^\s*\d+[.)] +/.test(line);
    const itemRe = /^\s*[-*+] +/.test(line) ? /^\s*[-*+] +(.*)$/
                 : ordered ? /^\s*\d+[.)] +(.*)$/ : null;
    if (itemRe) {
      flushP();
      const listEl = el(ordered ? "ol" : "ul", {});
      let item = null;
      while (i < lines.length) {
        const m2 = lines[i].match(itemRe);
        if (m2) {
          item = el("li", {});
          item.appendChild(inline(m2[1]));
          listEl.appendChild(item);
          i++;
        } else if (item && /^\s+\S/.test(lines[i])) {  // continuation line
          item.appendChild(document.createTextNode("\n" + lines[i].trim()));
          i++;
        } else break;
      }
      root.appendChild(listEl);
      continue;
    }
    if (!line.trim()) { flushP(); i++; continue; }
    para.push(line);
    i++;
  }
  flushP();
  return root;
}

// A picture the page can show — served by mh: a local image file (a
// screenshot the agent read) or one pasted into the session, decoded from
// the transcript. The token rides along as it does on every request.
const IMAGE_FILE = /\.(png|jpe?g|gif|webp)$/i;
function imageUrl(base) {
  const token = typeof TOKEN === "undefined" ? "" : TOKEN;
  return base + (base.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token);
}
function picture(url, alt) {
  const img = el("img", { class: "shot", loading: "lazy", alt: alt || "", src: url });
  // a file that has gone is a line of text, not a broken-image glyph
  img.addEventListener("error", () => img.replaceWith(
    el("span", { class: "clip", text: "(picture not available: " + (alt || url) + ")" })));
  return el("a", { class: "shotlink", href: url, target: "_blank", rel: "noopener" }, img);
}

function tip(evt, lines) {
  const t = $("tip");
  t.textContent = "";
  lines.forEach((l) => t.appendChild(el("div", { text: l })));
  t.className = "show";
  const pad = 14;
  t.style.left = Math.min(evt.clientX + pad, innerWidth - t.offsetWidth - 8) + "px";
  t.style.top = Math.max(8, evt.clientY - t.offsetHeight - pad) + "px";
}
const untip = () => ($("tip").className = "");

// --- the map ---------------------------------------------------------------

function drawMap() {
  const host = $("map");
  host.textContent = "";
  const cps = DATA.checkpoints;
  if (!cps.length) {
    host.setAttribute("height", 40);
    host.appendChild(svg("text", { x: 4, y: 22, fill: "var(--muted)",
      text: "no checkpoints yet — create one to begin" }));
    return;
  }
  const loadedSet = new Set(DATA.load.loaded);
  const inPack = new Set(DATA.load.included.map((id) => id.split("/")[0]));
  const bySlug = new Map(cps.map((c) => [c.slug, c]));
  // One column per stage; checkpoints at the same stage stack under its node.
  // The template's stages still ahead follow, dashed.
  const columns = DATA.stages.map((col) => ({ ...col, ghost: false }));
  const ahead = DATA.template ? DATA.template.stages.filter((st) => !st.exists) : [];
  ahead.forEach((st) => columns.push({ stage: st.slug, name: st.name, members: [], ghost: true }));
  // stacked takes are named beside their node, so a column is at least as
  // wide as the longest such name
  const beside = Math.max(0, ...columns.flatMap((col) => col.members.slice(1).map((slug) =>
    (slug.length + (slug === DATA.current ? 10 : 0)) * 6.6 + 40)));
  const step = Math.max(120, beside, Math.min(200, 900 / columns.length));
  const padX = 60, arcRoom = 26 + Math.min(cps.length, 6) * 11, stackGap = 46;
  const deepest = Math.max(1, ...columns.map((col) => col.members.length));
  const W = padX * 2 + step * (columns.length - 1);
  const axisY = arcRoom + 46, H = axisY + 78 + (deepest - 1) * stackGap;
  host.setAttribute("width", Math.max(W, 320));
  host.setAttribute("height", H);

  const x = (i) => padX + i * step;
  const maxSessions = Math.max(1, ...cps.map((c) => c.sessions.length));
  const r = (c) => 8 + 12 * Math.sqrt(c.sessions.length / maxSessions);
  const pos = new Map();  // slug -> where its node is drawn
  columns.forEach((col, i) => col.members.forEach((slug, k) =>
    pos.set(slug, { x: x(i), y: axisY + k * stackGap, r: r(bySlug.get(slug)) })));

  host.appendChild(svg("line", { x1: padX - 30, y1: axisY, x2: W - padX + 30, y2: axisY,
    stroke: "var(--baseline)", "stroke-width": 2 }));
  // a stack's spine, from the node on the axis down to its last member
  columns.forEach((col, i) => {
    if (col.members.length < 2) return;
    host.appendChild(svg("line", { x1: x(i), y1: axisY, x2: x(i),
      y2: axisY + (col.members.length - 1) * stackGap, stroke: "var(--baseline)", "stroke-width": 2 }));
  });

  // link arcs, drawn first so nodes sit above them
  DATA.links.forEach(([a, b], k) => {
    if (!pos.has(a) || !pos.has(b)) return;
    const [l, q] = pos.get(a).x <= pos.get(b).x ? [pos.get(a), pos.get(b)] : [pos.get(b), pos.get(a)];
    const lift = 22 + 11 * (k % 6);
    const d = l.x === q.x
      // two takes at one stage: a small arc beside the spine
      ? `M ${l.x + 10} ${l.y} Q ${l.x + 34} ${(l.y + q.y) / 2} ${q.x + 10} ${q.y}`
      : `M ${l.x} ${l.y - 12} Q ${(l.x + q.x) / 2} ${Math.min(l.y, q.y) - 12 - lift * 2} ${q.x} ${q.y - 12}`;
    const path = svg("path", { d, fill: "none", stroke: "var(--accent)", "stroke-width": 2, opacity: 0.55 });
    path.addEventListener("mousemove", (e) => tip(e, [`link: ${a} — ${b}`, "these load together"]));
    path.addEventListener("mouseleave", untip);
    host.appendChild(path);
  });

  columns.forEach((col, i) => {
    const stacked = col.members.length > 1;
    // the column's name, when the node's own does not say it
    if (!col.ghost && (stacked || col.members[0] !== col.stage)) {
      const top = pos.get(col.members[0]);
      host.appendChild(svg("text", { x: top.x, y: axisY - top.r - 26, "text-anchor": "middle",
        fill: "var(--text-secondary)", "font-size": "11", "font-weight": "600",
        text: col.stage + (stacked ? ` ×${col.members.length}` : "") }));
    }
    col.members.forEach((slug, k) => {
      const c = bySlug.get(slug), p = pos.get(slug);
      const active = inPack.has(slug) || (loadedSet.has(slug) && DATA.load.included.length === 0);
      const isCurrent = slug === DATA.current;
      const g = svg("g", { style: "cursor:pointer" });
      // generous hit target, independent of mark size
      g.appendChild(svg("circle", { cx: p.x, cy: p.y, r: 22, fill: "transparent" }));
      g.appendChild(svg("circle", {
        cx: p.x, cy: p.y, r: p.r,
        fill: active ? "var(--accent)" : "var(--neutral-mark)",
        stroke: "var(--surface-1)", "stroke-width": 2,
      }));
      if (isCurrent) {
        g.appendChild(svg("circle", { cx: p.x, cy: p.y, r: p.r + 5, fill: "none",
          stroke: "var(--text-primary)", "stroke-width": 2 }));
      }
      if (k === 0) {
        g.appendChild(svg("text", { x: p.x, y: p.y + p.r + 20, "text-anchor": "middle",
          fill: "var(--text-primary)", "font-weight": "600", text: slug }));
        if (isCurrent) g.appendChild(svg("text", { x: p.x, y: p.y + p.r + 34, "text-anchor": "middle",
          fill: "var(--text-primary)", "font-weight": "650", text: "current" }));
        g.appendChild(svg("text", { x: p.x, y: p.y - p.r - 10, "text-anchor": "middle",
          fill: "var(--muted)", text: c.created.slice(0, 10) }));
      } else {
        // a stacked take: named beside its node, where the next one is not
        g.appendChild(svg("text", { x: p.x + p.r + 9, y: p.y + 4, "font-size": "11.5",
          fill: "var(--text-primary)", "font-weight": isCurrent ? "650" : "600",
          text: slug + (isCurrent ? " · current" : "") }));
      }
      const toks = c.sessions.reduce((s, x) => s + x.tokens, 0);
      g.addEventListener("mousemove", (e) => tip(e, [
        slug + (col.stage !== slug ? ` · at ${col.stage}` : ""),
        `created ${c.created.slice(0, 10)} · ${c.sessions.length} session${c.sessions.length === 1 ? "" : "s"} · ~${toks} tokens`,
        active ? "included in the next mh load" : "not in the next mh load",
        RO ? "click to open" : "click for actions",
      ]));
      g.addEventListener("mouseleave", untip);
      g.addEventListener("click", () => { untip(); if (RO) selectCheckpoint(slug); else nodeMenu(g, c, col); });
      host.appendChild(g);
    });
    if (col.ghost) {
      const n = DATA.template.stages.findIndex((st) => st.slug === col.stage) + 1;
      const first = ahead[0] && ahead[0].slug === col.stage;
      const g = svg("g", { style: RO ? "" : "cursor:pointer" });
      g.appendChild(svg("circle", { cx: x(i), cy: axisY, r: 26, fill: "transparent" }));
      g.appendChild(svg("circle", { cx: x(i), cy: axisY, r: 8, fill: "var(--page)",
        stroke: "var(--muted)", "stroke-width": 2, "stroke-dasharray": "3 3" }));
      g.appendChild(svg("text", { x: x(i), y: axisY + 28, "text-anchor": "middle",
        fill: "var(--muted)", text: col.stage }));
      g.addEventListener("mousemove", (e) => tip(e, [
        col.name,
        `stage ${n} of ${DATA.template.total} in ${DATA.template.name} — not created yet`,
        RO ? "" : "click for actions: create it, rename or remove the stage, insert or move stages",
      ].filter(Boolean)));
      g.addEventListener("mouseleave", untip);
      if (!RO) g.addEventListener("click", () => { untip(); stageMenu(g, col.name, first); });
      host.appendChild(g);
    }
  });
}

// --- project memory --------------------------------------------------------
// Claude Code keeps notes about this project next to its transcripts; mh shows
// them read-only. Each card is a note: its markdown body, the notes it links
// to (clickable), and — reusing the trace path — a jump to the session it came
// from when that transcript is still here.

let MEMORY = null, MEM_OPEN = true;
const MEM_KEY = "mh.memory";  // localStorage: "0" keeps the section collapsed

async function loadMemory() {
  try { MEMORY = await api("/api/memory"); }
  catch { MEMORY = { present: false, memories: [] }; }
  MEM_OPEN = localStorage.getItem(MEM_KEY) !== "0";
  drawMemory();
}

function drawMemory() {
  const d = MEMORY;
  $("memsec").hidden = !(d && d.present && d.memories.length);
  if ($("memsec").hidden) return;
  const n = d.memories.length;
  $("memmeta").textContent = `${n} note${n === 1 ? "" : "s"} Claude Code keeps about this project · read-only`;
  $("memtoggle").textContent = MEM_OPEN ? "hide" : `show ${n}`;
  const list = $("memlist");
  list.hidden = !MEM_OPEN;
  list.textContent = "";
  if (!MEM_OPEN) return;
  const names = d.memories.map((m) => m.name);
  d.memories.forEach((m) => list.appendChild(memoryCard(m, names)));
}

function memoryCard(m, names) {
  const card = el("div", { class: "memcard", id: "mem-" + m.name });
  const head = el("header", {},
    el("span", { class: "mtype " + m.type, text: m.type }),
    el("span", { class: "mtitle", text: m.title || m.name }));
  head.appendChild(el("span", { class: "spacer" }));
  if (m.modified) head.appendChild(el("span", { class: "muted", style: "font-size:12px", text: m.modified }));
  if (m.origin) {
    const from = el("span", { class: "muted", style: "font-size:12px", text: " · from " });
    from.appendChild(el("code", { text: m.origin_key }));
    if (m.origin_here) from.appendChild(el("button", { class: "linklike", style: "margin-left:6px",
      text: "open session ↗", title: "Show that session's full transcript in the live panel",
      onclick: () => openOriginal(m.origin) }));
    head.appendChild(from);
  }
  card.appendChild(head);
  card.appendChild(md(m.body));
  if (m.links.length) {
    const rel = el("div", { class: "mrel" }, el("span", { text: "related:" }));
    m.links.forEach((name) => {
      const known = names.includes(name);
      rel.appendChild(el("button", { class: "memchip" + (known ? "" : " missing"), text: name,
        title: known ? "Jump to this note" : "Not written yet",
        onclick: known ? () => jumpToMemory(name) : null }));
    });
    card.appendChild(rel);
  }
  return card;
}

function jumpToMemory(name) {
  const card = $("mem-" + name);
  if (!card) return;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.remove("flash");
  void card.offsetWidth;  // restart the animation
  card.classList.add("flash");
}
