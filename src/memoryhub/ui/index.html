// bright HEY-style avatar circles: deterministic color from the session key
const AVATARS = ["#f5d652", "#f2846b", "#c7e86b", "#7fd8f5", "#c9b8f9", "#8fe3b0"];
function avatarColor(key) {
  let h = 0;
  for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATARS[h % AVATARS.length];
}
function sessionKey(file) {
  return file.slice(16).replace(/\.md$/, "");
}
function initialsFor(file) {
  const key = sessionKey(file);
  if (key.startsWith("pi-")) return "PI";
  if (key.startsWith("cx-")) return "CX";
  return "CL";
}
// The session's avatar says which model ran it — "F5" for Fable 5.1, "S4" for
// Sonnet 4.5, "G5" for gpt-5 — in the same colour the exchange chips give that
// model, so a session and its exchanges match by eye. A session with no model
// recorded (compacted, or saved before mh kept models) shows its agent instead.
function sessionAvatar(model, file) {
  if (!model) {
    const key = sessionKey(file);
    return { text: initialsFor(file), color: avatarColor(key), title: "model not recorded" };
  }
  const label = modelLabel(model);
  const letter = (label.match(/[A-Za-z]/) || [""])[0].toUpperCase();
  const digit = (label.match(/\d/) || [""])[0];
  return { text: (letter + digit) || label.slice(0, 2).toUpperCase(), color: avatarColor(model),
           title: label === model ? model : `${label} · ${model}` };
}
// "claude-sonnet-4-5-20250929" -> "Sonnet 4.5". Anything mh does not recognise
// is shown exactly as the session file records it — a raw id is short and
// honest, and inventing a pretty name for an unknown model would not be.
const FAMILIES = ["opus", "sonnet", "haiku", "fable", "mythos"];
function modelLabel(id) {
  const s = id.toLowerCase()
    .replace(/^[a-z]{2}\.anthropic\.|^anthropic[./]/, "")  // us.anthropic.claude-…
    .replace(/-v\d+:\d+$/, "")                             // bedrock -v1:0
    .replace(/[-@]\d{8}$/, "");                            // dated snapshots
  const m = s.match(/^claude-(?:(\d+)(?:-(\d+))?-)?([a-z]+)(?:-(\d+)(?:-(\d+))?)?$/);
  if (!m) return id;
  const [, preMajor, preMinor, family, postMajor, postMinor] = m;
  const major = preMajor || postMajor, minor = preMinor || postMinor;
  if (!major || !FAMILIES.includes(family)) return id;
  return family[0].toUpperCase() + family.slice(1) + " " + major + (minor ? "." + minor : "");
}

function modelChip(id) {
  const chip = el("span", { class: "modelchip", title: id });  // raw id on hover
  const dot = el("i", {});
  dot.style.background = avatarColor(id);
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(modelLabel(id)));
  return chip;
}

function niceStamp(file) {
  const s = file.slice(0, 15);  // YYYY-MM-DD_HHMM
  return `${s.slice(0, 10)} ${s.slice(11, 13)}:${s.slice(13, 15)}`;
}

function selectCheckpoint(slug) {
  SEL_CK = slug;
  $("sessec").hidden = true;
  const c = DATA.checkpoints.find((x) => x.slug === slug);
  if (!c) { $("ckptsec").hidden = true; return; }
  $("ckptsec").hidden = false;
  const at = c.stage && c.stage !== c.slug ? ` · at ${c.stage}` : "";
  $("ckpttitle").textContent = `${c.slug}${at} · created ${c.created.replace("_", " ")}`;
  $("ck-current").disabled = c.slug === DATA.current;
  $("ck-current").textContent = c.slug === DATA.current ? "✓ current" : "make current";
  const omitted = new Set(DATA.load.omitted);
  const list = $("sessions");
  list.textContent = "";
  if (!c.sessions.length) {
    list.appendChild(el("div", { class: "empty",
      text: "Nothing here yet — this checkpoint is waiting for its first session." }));
  }
  c.sessions.forEach((s) => {
    const who = sessionAvatar(s.model, s.file);
    const av = el("div", { class: "avatar", text: who.text, title: who.title });
    av.style.background = who.color;
    const title = el("div", { class: "stitle", text: niceStamp(s.file) },
      el("span", { class: "skey", text: "‹" + sessionKey(s.file) + "›" }));
    if (omitted.has(s.id)) title.appendChild(el("span", { class: "badge", text: "over budget" }));
    if (s.compacted) title.appendChild(el("span", { class: "badge", text: "compacted" }));
    if (s.legacy) title.appendChild(el("span", { class: "badge", text: "Q&A format" }));
    if (!s.editable && !s.compacted) title.appendChild(el("span", { class: "badge warn", text: "read-only" }));
    // a compacted session summarises N exchanges but stores none: "0" would read as empty
    const meta = (s.compacted || s.exchanges === null)
      ? `~${s.tokens} tokens` : `${s.exchanges} exch. · ~${s.tokens} tokens`;
    const row = el("div", { class: "srow" },
      av,
      el("div", { class: "smain" },
        title,
        el("div", { class: "spreview", text: meta + (s.preview ? " — " + s.preview : "") })),
      RO ? null :
        el("div", { class: "sacts" },
          el("button", { text: "move…",
            onclick: (e) => { e.stopPropagation(); moveSession(s, e.currentTarget); } }),
          el("button", { class: "danger", text: "delete",
            onclick: (e) => { e.stopPropagation(); deleteSession(s); } })));
    row.addEventListener("click", () => openSession(c.slug, s.file));
    list.appendChild(row);
  });
}

// --- session panel ---------------------------------------------------------

async function openSession(slug, file) {
  SEL_CK = slug;
  const data = await api(`/api/session?ckpt=${encodeURIComponent(slug)}&file=${encodeURIComponent(file)}`);
  $("sessec").hidden = false;
  $("sestitle").textContent = `${data.checkpoint} / ${data.file}` +
    (data.editable && !RO ? "" : "  — read-only");
  const host = $("exchanges");
  host.textContent = "";
  drawProvenance(data);
  if (!data.editable) {
    host.appendChild(el("p", { class: "empty", text: data.reason || "not editable" }));
  }
  if (data.raw) {
    // compacted: a summary in markdown, render it; unknown format: verbatim,
    // pretending to know its shape would misrender it
    const card = el("div", { class: "ex" });
    card.appendChild(el("header", {}, el("span", { class: "role",
      text: data.compacted ? "compacted summary" : "raw file" })));
    const body = el("div", { class: "turn" });
    body.appendChild(data.compacted ? md(data.raw) : el("pre", { class: "rawpre", text: data.raw }));
    card.appendChild(body);
    host.appendChild(card);
  }
  if (data.legacy && data.editable) {
    host.appendChild(el("p", { class: "muted",
      text: "This session is in the old Q&A format. Editing it rewrites the file in the current User/Agent format." }));
  }
  data.exchanges.forEach((ex) => host.appendChild(exchangeCard(data, ex)));
  $("sessec").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// Where a saved session came from: its original transcript, linked by the
// session id in the file. When that transcript is still on this machine, the
// live panel can open it unfiltered — the place to check what purification
// left out. Otherwise the id is shown as the record it is.
function drawProvenance(data) {
  const host = $("prov");
  host.textContent = "";
  if (!data.session_id) return;
  host.appendChild(el("span", { class: "muted", text: "from session " }));
  host.appendChild(el("code", { text: data.original ? data.original.key : data.session_id }));
  if (data.original) {
    host.appendChild(el("button", { class: "linklike", text: "open original ↗",
      title: "Show this session's full transcript — thinking, tool calls and all — in the live panel",
      onclick: () => openOriginal(data.session_id) }));
  } else {
    host.appendChild(el("span", { class: "muted",
      text: " · original transcript not on this machine" }));
  }
}

// The original transcript opens on a page of its own (`?view=`), so the
// purified session stays where the reader was and the two can sit side by side.
function viewUrl(sid) {
  return location.pathname + "?t=" + encodeURIComponent(TOKEN) + "&view=" + encodeURIComponent(sid);
}
function openOriginal(sid) {
  const w = window.open(viewUrl(sid), "_blank", "noopener");
  if (!w) toast("the browser blocked the new page — allow pop-ups for this map", "err");
}

function exchangeCard(data, ex) {
  const card = el("div", { class: "ex" });
  const head = el("header", {},
    el("span", { class: "role", text: "exchange " + ex.index }),
    el("span", { class: "spacer" }));
  if (data.editable && !RO) {
    head.appendChild(el("button", { text: "edit", onclick: () => editCard(card, data, ex) }));
    head.appendChild(el("button", { class: "danger", text: "delete", onclick: () => {
      if (!confirm(`Delete exchange ${ex.index}? The hub keeps it in git history.`)) return;
      act("/api/exchange/delete", { ckpt: data.checkpoint, file: data.file, index: ex.index },
        `deleted exchange ${ex.index}`, () => openSession(data.checkpoint, data.file));
    } }));
  }
  card.appendChild(head);
  const user = el("div", { class: "turn user" },
    el("span", { class: "rolechip user", text: "User" }));
  user.appendChild(md(ex.user));
  card.appendChild(user);
  const agent = el("div", { class: "turn agent" },
    el("span", { class: "rolechip agent", text: "Agent" }));
  // one chip per model, for the rare turn a model switch straddles
  for (const m of String(ex.model || "").split(", ")) if (m) agent.appendChild(modelChip(m));
  if (ex.agent) agent.appendChild(md(ex.agent));
  else agent.appendChild(el("p", { class: "empty", text: "(no textual reply captured)" }));
  card.appendChild(agent);
  return card;
}

function editCard(card, data, ex) {
  card.textContent = "";
  card.appendChild(el("header", {}, el("span", { class: "role", text: "editing exchange " + ex.index })));
  const u = el("textarea"); u.value = ex.user;
  const a = el("textarea"); a.value = ex.agent;
  const wrap = el("div", { style: "padding:10px 12px" });
  wrap.appendChild(el("div", { class: "role", style: "margin-bottom:4px", text: "User" }));
  wrap.appendChild(u);
  wrap.appendChild(el("div", { class: "role", style: "margin:10px 0 4px", text: "Agent" }));
  wrap.appendChild(a);
  wrap.appendChild(el("div", { class: "row end", style: "margin-top:10px" },
    el("button", { text: "cancel", onclick: () => openSession(data.checkpoint, data.file) }),
    el("button", { class: "primary", text: "save", onclick: () =>
      act("/api/exchange/edit",
        { ckpt: data.checkpoint, file: data.file, index: ex.index, user: u.value, agent: a.value },
        `rewrote exchange ${ex.index}`, () => openSession(data.checkpoint, data.file)) })));
  card.appendChild(wrap);
}

// --- the live session ------------------------------------------------------
// The transcript the agent is writing right now, re-read whenever it grows.
// Editing here never touches the transcript: each decision is recorded in a
// draft that mh applies at every save, so an exchange dropped mid-session is
// still gone when the session lands in a checkpoint.

const LIVE_POLL_MS = 2500;    // following the terminal, roughly a breath behind
const LIVE_HIDDEN_MS = 20000; // background tab: keep the fp warm, nothing more
const LIVE_TAIL = 3;          // exchanges shown by default: the feed is about now
// `?sid=` pins the live panel to one session: `mh ui` run from inside an agent
// session names its own, so the page follows the session that asked for it
// `?view=` opens a page for one transcript (from "open original"): pinned for
// good, unlike `?sid=`, which lets go of a session that has ended
const VIEW = PARAMS.get("view") || null;
let LIVE = null, LIVE_SID = VIEW || PARAMS.get("sid") || null, LIVE_EDIT = null, LIVE_TIMER = null;
let LIVE_ERR = false;
// A pin from the link (as opposed to a pick from the menu) holds only while
// that session is alive: once it has been quiet this long and the project has
// a newer transcript, the page follows what is happening now instead.
let LIVE_PINNED = VIEW ? null : (PARAMS.get("sid") || null);
const LIVE_QUIET = 600;  // seconds

function niceIdle(secs) {
  if (secs < 90) return `${secs} s`;
  if (secs < 5400) return `${Math.round(secs / 60)} min`;
  return `${Math.round(secs / 360) / 10} h`;
}

// Follow the newest transcript, and take the pin out of the address bar so a
// reload does not bring the old session back.
function followNewest(why) {
  LIVE_PINNED = null; LIVE_SID = null; LIVE = null;
  history.replaceState(null, "", location.pathname + "?t=" + encodeURIComponent(TOKEN));
  if (why) toast(why, "ok");
  runLive();
}
let LIVE_ALL = !!VIEW;        // the reader asked for the whole session (a viewer page starts with it)
// which tool calls the reader has opened, kept across redraws so a poll two
// seconds later does not close what they are in the middle of reading
const LIVE_OPEN = new Set();

async function pollLive() {
  // An open editor owns the panel: redrawing under it would throw away what
  // the user is typing while the agent keeps answering.
  if (LIVE_EDIT !== null) return;
  const q = new URLSearchParams({ fp: (LIVE && LIVE.fp) || "" });
  if (LIVE_SID) q.set("sid", LIVE_SID);
  if ($("livefull").checked) q.set("full", "1");
  try {
    const d = await api("/api/live?" + q);
    LIVE_ERR = false;
    if (!d.present) { LIVE = null; $("livesec").hidden = true; $("golive").hidden = true; return; }
    if (LIVE_PINNED && d.newest && d.key !== d.newest) {
      const mine = (d.sessions || []).find((s) => s.key === d.key);
      if (mine && mine.idle >= LIVE_QUIET) {
        followNewest(`‹${d.key}› has been quiet for ${niceIdle(mine.idle)} — following ‹${d.newest}›`);
        return;
      }
    }
    if (d.unchanged) { LIVE.fp = d.fp; return; }
    LIVE = d;
    drawLive();
  } catch (e) {
    if (!LIVE_ERR) toast(e.message, "err");  // once, not every 2.5s
    LIVE_ERR = true;
  }
}

function scheduleLive() {
  clearTimeout(LIVE_TIMER);
  if (!$("livewatch").checked) return;
  LIVE_TIMER = setTimeout(runLive, document.hidden ? LIVE_HIDDEN_MS : LIVE_POLL_MS);
}
async function runLive() { await pollLive(); scheduleLive(); }

// A live mutation: post, report, re-read the transcript, and refresh the map
// because a saved copy may have been rewritten along with the draft.
async function liveAct(path, body, okMsg) {
  try {
    const r = await post(path, { ...body, sid: LIVE_SID });
    toast(typeof okMsg === "function" ? okMsg(r) : okMsg, "ok");
    LIVE = null;              // force a full re-read, not an fp comparison
    await pollLive();
    await refresh();
  } catch (e) { toast(e.message, "err"); }
}

function drawLive() {
  const d = LIVE;
  $("livesec").hidden = false;
  $("livekey").textContent = `${d.agent} · ‹${d.key}›`;
  const n = d.exchanges.length;
  const bits = [`${n} exchange${n === 1 ? "" : "s"}`];
  if (d.pending) bits.push("answer in flight");
  if (d.edits) bits.push(`${d.edits} live edit${d.edits === 1 ? "" : "s"}`);
  if (d.stale) bits.push(`${d.stale} ignored (dialog moved)`);
  if ($("livefull").checked && d.stream === false)
    bits.push("full output not available for this agent");
  const stores = `${d.would_store} exchange${d.would_store === 1 ? "" : "s"}`;
  bits.push(d.saved
    ? (d.saved.in_sync
        ? `saved in ${d.saved.checkpoint} ✓`
        : `saved in ${d.saved.checkpoint} · out of date (a save stores ${stores})`)
    : `not saved yet (a save stores ${stores})`);
  $("livemeta").textContent = bits.join(" · ");
  $("live-follow").textContent = d.sessions.length > 1 ? "following ‹" + d.key + "› ▾" : "this project";
  $("live-follow").disabled = d.sessions.length < 2;
  const older = !!(d.newest && d.key !== d.newest);
  $("live-newest").hidden = !older;
  if (older) {
    const mine = (d.sessions || []).find((s) => s.key === d.key);
    bits.push(mine ? `quiet for ${niceIdle(mine.idle)} · newest is ‹${d.newest}›` : `newest is ‹${d.newest}›`);
    $("livemeta").textContent = bits.join(" · ");
  }
  $("livedot").className = "livedot" + ($("livewatch").checked ? "" : " off");
  $("live-discard").hidden = RO || !d.edits;
  drawComposer(d.terminal || {});
  $("live-save").hidden = RO;
  $("golive").hidden = false;
  const host = $("liveex");
  host.textContent = "";
  if (!n) host.appendChild(el("div", { class: "empty", text: "No dialog in this session yet." }));
  const shown = LIVE_ALL ? d.exchanges : d.exchanges.slice(-LIVE_TAIL);
  const hidden = n - shown.length;
  if (hidden > 0) {
    host.appendChild(el("button", { class: "earlier",
      text: `show ${hidden} earlier exchange${hidden === 1 ? "" : "s"}`,
      onclick: () => { LIVE_ALL = true; drawLive(); } }));
  } else if (LIVE_ALL && n > LIVE_TAIL) {
    host.appendChild(el("button", { class: "earlier", text: `show only the latest ${LIVE_TAIL}`,
      onclick: () => { LIVE_ALL = false; drawLive(); } }));
  }
  shown.forEach((ex) => host.appendChild(liveCard(ex)));
}

// Where a typed message would land, or why it would not. Never a guess: the
// server re-checks the pane and the process every poll, so this line is the
// current truth rather than what was true at session start.
function drawComposer(term) {
  const ok = !!term.pane && !RO;
  $("composer").hidden = RO;
  $("sayto").textContent = term.pane
    ? `→ tmux pane ${term.pane}${term.how ? " · " + term.how : ""}`
    : (term.reason || "no terminal found for this session");
  $("sayto").className = "to" + (term.pane ? "" : " off");
  $("say").disabled = !ok;
  $("say-send").disabled = !ok;
  $("say-slash").disabled = !ok;
}

async function say() {
  const text = $("say").value.trim();
  if (!text) return;
  $("say-send").disabled = true;
  closePalette();
  try {
    const r = await post("/api/live/say", { text, sid: LIVE_SID });
    $("say").value = "";
    const cmd = slashState(text);
    toast(cmd ? `sent /${cmd.name} to ${r.pane}` : `sent to ${r.pane}`, "ok");
    LIVE = null;
    await pollLive();   // the turn shows up as soon as the agent writes it
  } catch (e) {
    toast(e.message, "err");
  } finally {
    $("say-send").disabled = false;
  }
}

// --- the composer's palette ------------------------------------------------
// What the box offers when a message starts with "/": the CLI's own skills
// and commands, read from disk by mh, and the models behind /model. The text
// is composed here and pasted into the session — the CLI runs it, exactly as
// if it had been typed at its prompt, so nothing here needs to know what a
// command does.

// The slash command a message is, or null for prose: {name, args} with args
// null while the name is still being typed and a string once a space follows
// it. A second line ends it — a command is one line.
function slashState(text) {
  if (text.includes("\n")) return null;
  const m = /^\/(\S*)(?:\s+(.*))?$/.exec(text);
  if (!m) return null;
  return { name: m[1], args: m[2] === undefined ? null : m[2] };
}

// Ranked: an exact name, then a name starting with the query, then one
// containing it, then a description containing it; ties keep list order.
function paletteMatches(items, query) {
  const q = query.toLowerCase();
  const rank = (it) => {
    if (!q) return 0;
    const n = it.name.toLowerCase();
    if (n === q) return 0;
    if (n.startsWith(q)) return 1;
    if (n.includes(q)) return 2;
    return (it.description || "").toLowerCase().includes(q) ? 3 : -1;
  };
  return items.map((it, i) => ({ it, r: rank(it), i }))
    .filter((x) => x.r >= 0)
    .sort((a, b) => a.r - b.r || a.i - b.i)
    .map((x) => x.it);
}

// the models /model may be given: the CLI's aliases, then what this session
// has already used, newest first
function modelItems(cmds) {
  const seen = [];
  for (const ex of (LIVE ? LIVE.exchanges : []).slice().reverse())
    for (const m of String(ex.model || "").split(", ")) if (m && !seen.includes(m)) seen.push(m);
  return [
    ...(cmds.models || []).map((m) => ({ name: m.name, description: m.description, kind: "alias" })),
    ...seen.map((m) => ({ name: m, description: modelLabel(m), kind: "used here" })),
  ];
}

let COMMANDS = null, COMMANDS_KEY = "", COMMANDS_AT = 0;
const COMMANDS_TTL = 60000;  // a skill installed mid-session shows up within a minute
const PALETTE = { mode: null, items: [], sel: 0, seq: 0 };

async function loadCommands() {
  const key = LIVE ? LIVE.key : "";
  if (COMMANDS && COMMANDS_KEY === key && Date.now() - COMMANDS_AT < COMMANDS_TTL) return COMMANDS;
  const q = new URLSearchParams();
  if (LIVE_SID) q.set("sid", LIVE_SID);
  COMMANDS = await api("/api/live/commands?" + q);
  COMMANDS_KEY = key;
  COMMANDS_AT = Date.now();
  return COMMANDS;
}

function closePalette() {
  $("palette").hidden = true;
  PALETTE.mode = null;
  PALETTE.items = [];
}

async function updatePalette() {
  const st = slashState($("say").value);
  if (!st || $("say").disabled) { closePalette(); return; }
  const seq = ++PALETTE.seq;
  let cmds;
  try { cmds = await loadCommands(); } catch (e) { closePalette(); toast(e.message, "err"); return; }
  if (seq !== PALETTE.seq) return;  // the box changed while the list was loading
  if (st.args === null) {
    PALETTE.mode = "commands";
    PALETTE.items = paletteMatches(cmds.commands || [], st.name);
  } else if (st.name === "model" && (cmds.commands || []).some((c) => c.name === "model")) {
    PALETTE.mode = "models";
    PALETTE.items = paletteMatches(modelItems(cmds), st.args);
  } else {
    closePalette();  // a finished name: the rest of the line is its arguments
    return;
  }
  PALETTE.sel = 0;
  drawPalette(cmds);
}

function drawPalette(cmds) {
  const box = $("palette");
  box.textContent = "";
  box.hidden = false;
  const models = PALETTE.mode === "models";
  let head;
  if (models) head = "/model — a name the CLI resolves, or a model this session has used";
  else if (cmds.known) head = `skills and commands of ${cmds.agent} — ↑↓ choose · ⏎ or ⇥ inserts · esc closes`;
  else head = `no command list for ${cmds.agent} — mh has not verified how it spells them; type it and it goes through all the same`;
  box.appendChild(el("div", { class: "phead", text: head }));
  if (!PALETTE.items.length && cmds.known)
    box.appendChild(el("div", { class: "pempty", text: "nothing on the list matches — what you typed goes through all the same" }));
  PALETTE.items.forEach((it, i) => {
    const kind = it.kind === "builtin" ? "built-in"
      : it.where && it.where !== it.kind && it.where !== cmds.agent ? `${it.kind} · ${it.where}` : it.kind;
    const row = el("div", { class: "pitem" + (i === PALETTE.sel ? " sel" : ""),
      // mousedown, not click: the box must keep the keyboard
      onmousedown: (e) => { e.preventDefault(); pickPalette(i); } },
      el("span", { class: "pname", text: (models ? "" : "/") + it.name }),
      it.hint ? el("span", { class: "phint", text: it.hint }) : null,
      el("span", { class: "pdesc", text: it.description || "" }),
      el("span", { class: "pkind", text: kind }));
    box.appendChild(row);
  });
}

function movePalette(step) {
  if (!PALETTE.items.length) return;
  PALETTE.sel = (PALETTE.sel + step + PALETTE.items.length) % PALETTE.items.length;
  const rows = $("palette").querySelectorAll(".pitem");
  rows.forEach((r, i) => r.classList.toggle("sel", i === PALETTE.sel));
  if (rows[PALETTE.sel]) rows[PALETTE.sel].scrollIntoView({ block: "nearest" });
}

function pickPalette(i) {
  const it = PALETTE.items[i];
  if (!it) return;
  const ta = $("say");
  if (PALETTE.mode === "models") {
    ta.value = "/model " + it.name;
    closePalette();
  } else {
    ta.value = "/" + it.name + " ";
    updatePalette();  // /model goes on to its models; anything else is done
  }
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

function wirePalette() {
  const ta = $("say");
  ta.addEventListener("input", updatePalette);
  ta.addEventListener("focus", updatePalette);
  ta.addEventListener("blur", closePalette);
  ta.addEventListener("keydown", (e) => {
    if ($("palette").hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); movePalette(e.key === "ArrowDown" ? 1 : -1); }
    else if ((e.key === "Enter" || e.key === "Tab") && !e.ctrlKey && !e.metaKey && PALETTE.items.length) { e.preventDefault(); pickPalette(PALETTE.sel); }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  });
  $("say-slash").onclick = () => {
    if (!ta.value.startsWith("/")) ta.value = "/" + ta.value;
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    updatePalette();
  };
}

function liveCard(ex) {
  const card = el("div", { class: "ex" + (ex.dropped ? " dropped" : "") });
  const head = el("header", {}, el("span", { class: "role", text: "exchange " + ex.index }));
  if (ex.pending) head.appendChild(el("span", { class: "badge", text: "in flight" }));
  if (ex.edited) head.appendChild(el("span", { class: "badge", text: "edited" }));
  if (ex.dropped) head.appendChild(el("span", { class: "badge warn", text: "dropped" }));
  head.appendChild(el("span", { class: "spacer" }));
  if (!RO) {
    if (ex.dropped) {
      head.appendChild(el("button", { text: "restore", onclick: () =>
        liveAct("/api/live/restore", { index: ex.index }, `exchange ${ex.index} restored`) }));
    } else {
      head.appendChild(el("button", { text: "edit", onclick: () => liveEditCard(card, ex) }));
      head.appendChild(el("button", { class: "danger", text: "drop", onclick: () =>
        liveAct("/api/live/drop", { index: ex.index },
          `exchange ${ex.index} will not be saved`) }));
    }
  }
  card.appendChild(head);
  if (ex.dropped) {
    // the point of a drop is that it is gone; one struck line is enough to
    // recognise it by, and "restore" is right there
    card.appendChild(el("div", { class: "droppreview",
      text: String(ex.user).split("\n")[0].trim() }));
    return card;
  }
  const user = el("div", { class: "turn user" }, el("span", { class: "rolechip user", text: "User" }));
  user.appendChild(md(ex.user));
  for (const im of ex.images || []) {  // pictures pasted with the question
    user.appendChild(picture(imageUrl(im.url), `picture ${im.n} (${im.type})`));
  }
  card.appendChild(user);
  const agent = el("div", { class: "turn agent" }, el("span", { class: "rolechip agent", text: "Agent" }));
  for (const m of String(ex.model || "").split(", ")) if (m) agent.appendChild(modelChip(m));
  if (ex.parts && ex.parts.length) {
    // unfiltered: everything the agent emitted, in the order it happened,
    // with the calls of one reply kept together as the batch they ran as
    for (let k = 0; k < ex.parts.length; ) {
      const batch = ex.parts[k].batch;
      if (!batch) { agent.appendChild(livePart(ex, k, ex.parts[k])); k++; continue; }
      const run = [];
      while (k < ex.parts.length && ex.parts[k].batch === batch) { run.push([k, ex.parts[k]]); k++; }
      agent.appendChild(liveBatch(ex, run));
    }
  } else if (ex.agent) {
    agent.appendChild(md(ex.agent));
  } else {
    agent.appendChild(el("p", { class: "empty",
      text: ex.pending ? "(still answering…)" : "(no textual reply captured)" }));
  }
  card.appendChild(agent);
  return card;
}

// One emitted block. Text reads as dialog; thinking is dimmed prose; a tool
// call is its name and most telling argument on one line, with the whole call
// one click away — shown, not hidden, but not drowning the reading either.
// Tools the agent asked for in a single reply run at the same time. Shown as
// one step with a rail down the side, because "three calls in parallel" is a
// different act from three calls in a row — and the transcript knows which.
function liveBatch(ex, run) {
  const size = run[0][1].batch_size || run.length;
  const box = el("div", { class: "part batch" },
    el("div", { class: "batchhead",
      text: run.length === size ? `${size} calls in parallel`
                                : `${run.length} of ${size} calls in parallel` }));
  run.forEach(([k, part]) => box.appendChild(livePart(ex, k, part)));
  return box;
}

function livePart(ex, k, part) {
  if (part.kind === "tool") {
    const key = ex.index + ":" + k;
    const summary = el("summary", {},
      el("span", { class: "toolname", text: part.name || "tool" }));
    if (part.preview) summary.appendChild(el("span", { class: "toolarg", text: part.preview }));
    if (part.sidechain) summary.appendChild(el("span", { class: "badge", text: "subagent" }));
    const body = el("pre", {});
    body.appendChild(highlight(part.text, codeLang("", part.text)));
    const shot = part.preview && part.preview.startsWith("/") && IMAGE_FILE.test(part.preview);
    const box = el("details", { class: (shot ? "" : "part ") + "tool", open: LIVE_OPEN.has(key) ? "" : null,
      ontoggle: (e) => e.currentTarget.open ? LIVE_OPEN.add(key) : LIVE_OPEN.delete(key) },
      summary, body);
    if (part.clipped) box.appendChild(el("div", { class: "clip", text: "… clipped" }));
    if (!shot) return box;
    // the agent read a picture: show it, not just the path it read
    return el("div", { class: "part" }, box,
      picture(imageUrl("/api/image?path=" + encodeURIComponent(part.preview)), part.preview));
  }
  const box = el("div", { class: "part " + (part.kind === "thinking" ? "think" : "say") });
  if (part.kind !== "text" || part.sidechain) {
    box.appendChild(el("div", { class: "partchip",
      text: (part.sidechain ? "subagent " : "") + part.kind }));
  }
  box.appendChild(md(part.text));
  if (part.clipped) box.appendChild(el("div", { class: "clip", text: "… clipped" }));
  return box;
}

function liveEditCard(card, ex) {
  LIVE_EDIT = ex.index;  // freezes polling until this editor closes
  card.textContent = "";
  card.appendChild(el("header", {}, el("span", { class: "role", text: "editing live exchange " + ex.index })));
  const u = el("textarea"); u.value = ex.user;
  const a = el("textarea"); a.value = ex.agent;
  const close = async (msg, r) => {
    LIVE_EDIT = null;
    if (msg) { toast(typeof msg === "function" ? msg(r) : msg, "ok"); await refresh(); }
    LIVE = null;
    await pollLive();
    scheduleLive();
  };
  const wrap = el("div", { style: "padding:10px 12px" });
  wrap.appendChild(el("div", { class: "role", style: "margin-bottom:4px", text: "User" }));
  wrap.appendChild(u);
  wrap.appendChild(el("div", { class: "role", style: "margin:10px 0 4px", text: "Agent" }));
  wrap.appendChild(a);
  wrap.appendChild(el("div", { class: "row end", style: "margin-top:10px" },
    el("span", { class: "muted", style: "flex:1;font-size:12px",
      text: "Stored in the live draft — mh applies it every time this session is saved." }),
    el("button", { text: "cancel", onclick: () => close() }),
    el("button", { class: "primary", text: "save", onclick: async () => {
      try {
        await post("/api/live/edit", { index: ex.index, user: u.value, agent: a.value, sid: LIVE_SID });
        await close(`exchange ${ex.index} rewritten`);
      } catch (e) { toast(e.message, "err"); }
    } })));
  card.appendChild(wrap);
}

function wireLive() {
  // the shortcut is what the keyboard in front of the page actually has
  const mac = /Mac|iPhone|iPad/.test(navigator.platform);
  $("say-send").textContent = mac ? "send ⌘⏎" : "send Ctrl+⏎";
  $("golive").onclick = () => {
    $("livesec").scrollIntoView({ behavior: "smooth", block: "start" });
    if (!$("say").disabled) $("say").focus({ preventScroll: true });
  };
  $("livewatch").onchange = () => {
    $("livedot").className = "livedot" + ($("livewatch").checked ? "" : " off");
    if ($("livewatch").checked) runLive(); else clearTimeout(LIVE_TIMER);
  };
  $("livefull").onchange = () => { LIVE = null; runLive(); };
  $("say-send").onclick = say;
  $("say").addEventListener("keydown", (e) => {
    // ⌘/ctrl+enter sends; plain enter stays a newline, so a paragraph is one message
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); say(); }
  });
  $("live-save").onclick = () =>
    liveAct("/api/live/save", {}, (r) => `saved ${r.file} -> ${r.checkpoint}`);
  $("live-discard").onclick = () => {
    if (!confirm("Discard every live edit for this session?\n\nThe dialog goes back to what the transcript says.")) return;
    liveAct("/api/live/discard", {}, "live edits discarded");
  };
  $("live-follow").onclick = () => {
    if (!LIVE) return;
    const label = (s) => `${s.key} · ${s.agent} · ${s.file}`;
    const bySid = new Map(LIVE.sessions.map((s) => [label(s), s.sid]));
    menu($("live-follow"), "follow which session…", [...bySid.keys()],
      "only one transcript in this project", (pick) => {
        LIVE_SID = bySid.get(pick);
        LIVE_PINNED = null;  // a deliberate pick is never switched away from
        LIVE = null;
        runLive();
      });
  };
  $("live-newest").onclick = () => followNewest();
  // A background tab should not poll every 2.5s; coming back should not wait.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && $("livewatch").checked) runLive(); else scheduleLive();
  });
}

// --- mutations -------------------------------------------------------------

const otherCheckpoints = () => DATA.checkpoints.map((c) => c.slug).filter((x) => x !== SEL_CK);

function createCheckpoint(name, at) {
  act("/api/checkpoint/create", { name, at }, (r) => `checkpoint ${r.slug} created`);
}

// Everything the CLI can do to a checkpoint, from its node: open the panel,
// point `current` at it, rename, another take at its stage, link, delete —
// and, when it stands for a template stage, insert stages around it.
function nodeMenu(anchor, c, col) {
  const isCurrent = c.slug === DATA.current;
  const stageOf = DATA.template ? DATA.template.stages.find((st) => st.slug === col.stage) : null;
  const items = [
    [`open ${c.slug}`, () => selectCheckpoint(c.slug)],
    [isCurrent ? "✓ current" : "make current", isCurrent ? null : () => makeCurrent(c.slug)],
    ["rename…", () => ask(anchor, `rename ${c.slug} to…`, c.slug, (name) =>
      act("/api/checkpoint/rename", { slug: c.slug, name }, (r) => `renamed to ${r.slug}`,
        (r) => { if (SEL_CK === c.slug) { SEL_CK = r.slug; selectCheckpoint(r.slug); } }))],
    [`+ another at ${col.stage}`, () => createCheckpoint(null, col.stage)],
    ["link to…", () => menu(anchor, `link ${c.slug} with…`,
      DATA.checkpoints.map((x) => x.slug).filter((x) => x !== c.slug), "nothing to link to",
      (b) => act("/api/link", { a: c.slug, b }, "linked"))],
  ];
  if (stageOf) {
    items.push(["insert a stage before…", () => insertStage(anchor, stageOf.name, 0)]);
    items.push(["insert a stage after…", () => insertStage(anchor, stageOf.name, 1)]);
  }
  items.push(["delete…", () => {
    if (!confirm(`Delete checkpoint ${c.slug} and its ${c.sessions.length} session(s)?\n\nThe hub keeps everything in git history.`)) return;
    if (SEL_CK === c.slug) { SEL_CK = null; $("ckptsec").hidden = true; $("sessec").hidden = true; }
    act("/api/checkpoint/delete", { slug: c.slug }, "checkpoint deleted");
  }]);
  actionMenu(anchor, c.slug + (col.stage !== c.slug ? ` · at ${col.stage}` : ""), items);
}

// A stage still ahead: create it, or edit the template's list around it.
function stageMenu(anchor, name, isNext) {
  const t = DATA.template, i = t.stages.findIndex((st) => st.name === name);
  const items = [
    [isNext ? `▶ create ${name} — next stage` : `create ${name} out of turn`, () => createCheckpoint(name)],
    ["rename stage…", () => ask(anchor, `rename stage ${name} to…`, name, (v) =>
      setStages(t.stages.map((st, k) => (k === i ? v : st.name)), `stage renamed to ${v}`))],
    ["insert a stage before…", () => insertStage(anchor, name, 0)],
    ["insert a stage after…", () => insertStage(anchor, name, 1)],
  ];
  if (i > 0) items.push(["move earlier", () => setStages(swapped(t.stages.map((st) => st.name), i, i - 1), `${name} moved earlier`)]);
  if (i < t.stages.length - 1) items.push(["move later", () => setStages(swapped(t.stages.map((st) => st.name), i, i + 1), `${name} moved later`)]);
  items.push(["remove stage", () => {
    if (!confirm(`Remove the stage "${name}" from the ${t.name} template?\n\nNo checkpoint is touched; the template just stops expecting it.`)) return;
    setStages(t.stages.map((st) => st.name).filter((_, k) => k !== i), `stage ${name} removed`);
  }]);
  actionMenu(anchor, `${name} — stage ${i + 1} of ${t.total}, not created yet`, items);
}

function insertStage(anchor, near, offset) {
  const names = DATA.template.stages.map((st) => st.name);
  const i = names.indexOf(near);
  ask(anchor, `new stage ${offset ? "after" : "before"} ${near}`, "", (v) => {
    const next = names.slice();
    next.splice(i + offset, 0, v);
    setStages(next, `stage ${v} added`);
  });
}

const swapped = (arr, i, j) => { const out = arr.slice(); [out[i], out[j]] = [out[j], out[i]]; return out; };
const setStages = (stages, msg) => act("/api/template/stages", { stages }, msg);
const makeCurrent = (slug) => act("/api/goto", { slug }, (r) => `current is now ${r.current}`);

// a menu of labelled actions (menu() takes bare strings, which is right for
// picking a name and wrong for a verb list)
function actionMenu(anchor, label, items) {
  closeMenu();
  const m = el("div", { id: "menu" }, el("div", { class: "menu-label", text: label }));
  items.forEach(([text, fn]) => m.appendChild(el("button", { text, disabled: fn ? null : "", onclick: (e) => {
    e.stopPropagation(); closeMenu(); if (fn) fn();
  } })));
  openMenu(m, anchor);
}

function deleteSession(s) {
  if (!confirm(`Delete session ${s.file}? The hub keeps it in git history.`)) return;
  $("sessec").hidden = true;
  act("/api/session/delete", { ckpt: SEL_CK, file: s.file }, "session deleted");
}

function moveSession(s, anchor) {
  menu(anchor, `move ${s.file} to…`, otherCheckpoints(),
    "no other checkpoint to move into", (to) => {
      $("sessec").hidden = true;
      act("/api/session/move", { ckpt: SEL_CK, file: s.file, to }, `moved to ${to}`);
    });
}

function wire() {
  $("reload").onclick = $("budget").onchange = () => refresh();
  $("memtoggle").onclick = () => {
    MEM_OPEN = !MEM_OPEN;
    localStorage.setItem(MEM_KEY, MEM_OPEN ? "1" : "0");
    drawMemory();
  };
  $("newckpt").onclick = () => {
    const t = DATA.template, ahead = t ? t.stages.filter((st) => !st.exists) : [];
    const cur = DATA.checkpoints.find((c) => c.slug === DATA.current);
    const here = cur ? (cur.stage || cur.slug) : null;
    if (!ahead.length && !here) {
      ask($("newckpt"), "new checkpoint — it becomes current", "", createCheckpoint);
      return;
    }
    // the template's next stage, one more take at the current stage, the rest
    // of the stages, or any name
    const other = "another name…", again = here ? `another at ${here} (${here}-N)` : null;
    const label = (st, k) => (k === 0 ? "▶ " : "") + st.name +
      (k === 0 ? ` — next (stage ${t.stages.indexOf(st) + 1} of ${t.total})` : "");
    const byLabel = new Map(ahead.map((st, k) => [label(st, k), st.name]));
    const items = [...byLabel.keys()];
    if (again) items.splice(Math.min(1, items.length), 0, again);
    menu($("newckpt"), t ? `new checkpoint — ${t.name} template` : "new checkpoint", [...items, other], "",
      (pick) => {
        if (pick === other) ask($("newckpt"), "new checkpoint — it becomes current", "", createCheckpoint);
        else if (pick === again) createCheckpoint(null, here);
        else createCheckpoint(byLabel.get(pick));
      });
  };
  $("tmpl").onclick = () => {
    const cur = DATA.template ? DATA.template.name : null;
    const none = "none — name every checkpoint yourself";
    const label = (t) => `${t.name === cur ? "✓ " : ""}${t.name} — ${t.stages.length} stages: ` +
      t.stages.map((st) => st.name).join(" → ");
    const byLabel = new Map(DATA.templates.map((t) => [label(t), t.name]));
    menu($("tmpl"), "stage template — default names for the checkpoints ahead",
      [...byLabel.keys(), ...(cur ? [none] : [])], "", (pick) => {
        const name = pick === none ? null : byLabel.get(pick);
        if (name === cur) return;
        act("/api/template", { name },
          name ? `template ${name} — mh names the stages from here` : "template cleared");
      });
  };
  $("ck-current").onclick = () => { if (SEL_CK) makeCurrent(SEL_CK); };
  $("ck-another").onclick = () => {
    const c = DATA.checkpoints.find((x) => x.slug === SEL_CK);
    if (c) createCheckpoint(null, c.stage || c.slug);
  };
  $("ck-rename").onclick = () =>
    ask($("ck-rename"), `rename ${SEL_CK} to…`, SEL_CK, (name) => {
      $("sessec").hidden = true;
      act("/api/checkpoint/rename", { slug: SEL_CK, name },
        (r) => `renamed to ${r.slug}`, (r) => { SEL_CK = r.slug; selectCheckpoint(SEL_CK); });
    });
  $("ck-delete").onclick = () => {
    const c = DATA.checkpoints.find((x) => x.slug === SEL_CK);
    if (!confirm(`Delete checkpoint ${SEL_CK} and its ${c.sessions.length} session(s)?\n\nThe hub keeps everything in git history.`)) return;
    SEL_CK = null; $("ckptsec").hidden = true; $("sessec").hidden = true;
    act("/api/checkpoint/delete", { slug: c.slug }, "checkpoint deleted");
  };
  $("ck-link").onclick = () =>
    menu($("ck-link"), `link ${SEL_CK} with…`, otherCheckpoints(),
      "nothing to link to", (b) => act("/api/link", { a: SEL_CK, b }, "linked"));
  $("ck-unlink").onclick = () => {
    const partners = DATA.links.filter((e) => e.includes(SEL_CK)).map((e) => (e[0] === SEL_CK ? e[1] : e[0]));
    menu($("ck-unlink"), `unlink ${SEL_CK} from…`, partners,
      "no links on this checkpoint", (b) => act("/api/unlink", { a: SEL_CK, b }, "unlinked"));
  };
}

async function refresh() {
  const budget = $("budget").value;
  DATA = await api("/api/map?budget=" + encodeURIComponent(budget === "" ? "none" : budget));
  $("current").textContent = DATA.current ? "current: " + DATA.current : "no current checkpoint";
  const t = DATA.template;
  $("tmpl").textContent = t ? `template: ${t.name} ▾` : "template ▾";
  $("tmpl").title = t
    ? `${t.done} of ${t.total} stages created` + (t.next ? ` · next: ${t.next}` : "")
    : "Stage template: default names for the checkpoints ahead";
  $("legend-ahead").hidden = !(t && t.done < t.total);
  if (DATA.load.error) toast(DATA.load.error, "err");
  drawMap();
  loadMemory();
  if (SEL_CK && !DATA.checkpoints.some((c) => c.slug === SEL_CK)) {
    SEL_CK = null; $("ckptsec").hidden = true; $("sessec").hidden = true;
  }
  // an invariant of refreshing, not something each call site must remember
  if (SEL_CK) selectCheckpoint(SEL_CK);
}

wire();
wireLive();
wirePalette();
$("budget").value = CFG.budget ?? "";
$("hubpath").textContent = CFG.hub;
if (CFG.version) document.title += " · v" + CFG.version;
if (VIEW) {
  document.body.classList.add("viewonly");
  document.querySelector("header h1").textContent = "mh — original transcript";
  document.querySelector("#livesec h2").firstChild.textContent = "Original transcript";
  document.title = "mh — original ‹" + VIEW.slice(0, 8) + "›";
}
if (RO) {
  $("robadge").hidden = false;
  $("newckpt").hidden = true;
  $("tmpl").hidden = true;
  $("ckactions").hidden = true;
}
refresh().catch((e) => toast(e.message, "err"));
runLive();
</script>
</body>
</html>
