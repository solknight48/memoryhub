<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>mh — checkpoint map</title>
<style>
/* HEY-inspired: warm cream canvas, white cards, HEY purple, mint pills,
   bright avatar circles, big friendly type. */
:root {
  color-scheme: light;
  --surface-1: #ffffff;
  --page: #faf6f0;
  --text-primary: #161310;
  --text-secondary: #57524b;
  --muted: #8d867c;
  --grid: #efe8dd;
  --baseline: #d9d0c2;
  --border: rgba(22, 19, 16, 0.08);
  --accent: #5522fa;
  --accent-soft: #f1ecff;
  --mint: #b9f0d3;
  --mint-ink: #0b3d24;
  --neutral-mark: #b3aa9d;
  --critical: #d03b3b;
  --good: #0a7d43;
  --avatar-ink: #161310;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-1: #211d18;
    --page: #141110;
    --text-primary: #f7f4ef;
    --text-secondary: #c9c2b8;
    --muted: #8d867c;
    --grid: #35302a;
    --baseline: #48413a;
    --border: rgba(247, 244, 239, 0.10);
    --accent: #9d8cff;
    --accent-soft: #2a2440;
    --mint: #1f4d36;
    --mint-ink: #b9f0d3;
    --neutral-mark: #6a635a;
    --critical: #e0655a;
    --good: #39c47a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 14px 24px; background: var(--page);
}
header h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
header .hub { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
.spacer { flex: 1; }
main { padding: 8px 24px 28px; max-width: 1100px; margin: 0 auto; }
.tagline { text-align: center; color: var(--text-secondary); font-size: 14px; margin: 4px 0 18px; }
section {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 20px; padding: 22px 24px; margin-bottom: 22px;
  box-shadow: 0 1px 2px rgba(20, 15, 5, 0.03), 0 12px 32px -28px rgba(20, 15, 5, 0.35);
}
h2 { font-size: 17px; margin: 0 0 14px; font-weight: 800; color: var(--text-primary);
     letter-spacing: -0.01em; }
.mapwrap { overflow-x: auto; }
svg { display: block; }
svg text { font: 11px system-ui, sans-serif; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px;
          font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
button {
  font: inherit; font-size: 12.5px; font-weight: 650; padding: 6px 14px;
  border-radius: 999px; border: 1px solid var(--baseline);
  background: var(--surface-1); color: var(--text-primary); cursor: pointer;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
button.danger:hover { border-color: var(--critical); color: var(--critical); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { color: #fff; opacity: 0.92; }
button.mint { background: var(--mint); border-color: transparent; color: var(--mint-ink); font-weight: 700; }
button.mint:hover { color: var(--mint-ink); opacity: 0.88; }
input[type=number], textarea {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--baseline); background: var(--surface-1); color: var(--text-primary);
  width: 100%;
}
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
           line-height: 1.55; resize: vertical; min-height: 90px; border-radius: 12px; }
/* sessions as a Screener-style list: bright avatar circle, bold title with a
   ‹key›, then one gray line of meta — preview */
.srow { display: flex; align-items: flex-start; gap: 14px; padding: 14px 12px;
        border-top: 1px solid var(--grid); cursor: pointer; border-radius: 14px; }
.srow:first-child { border-top: 0; }
.srow:hover { background: var(--accent-soft); }
.srow:hover + .srow { border-top-color: transparent; }
.avatar { width: 44px; height: 44px; border-radius: 50%; flex: none;
          display: flex; align-items: center; justify-content: center;
          font-weight: 800; font-size: 14px; color: var(--avatar-ink); }
.smain { flex: 1; min-width: 0; }
.stitle { font-weight: 750; font-size: 14.5px; }
.stitle .key { color: var(--muted); font-weight: 500; font-size: 12.5px;
               font-family: ui-monospace, monospace; margin-left: 4px; }
.spreview { color: var(--text-secondary); font-size: 13px; line-height: 1.45; margin-top: 3px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sacts { display: flex; gap: 8px; flex: none; align-self: center; }
.badge { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
         border: 1px solid var(--border); color: var(--text-secondary); margin-left: 6px; }
.badge.warn { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.ex { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.ex header { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
             background: var(--page); border: 0; border-bottom: 1px solid var(--border); }
.ex .role { font-size: 11px; font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
/* one turn = one readable column: prose face, capped measure, role color-coded */
.turn { padding: 12px 16px; }
.turn.user { background: color-mix(in srgb, var(--accent) 5%, transparent);
             border-left: 3px solid var(--accent); }
.turn.agent { border-left: 3px solid var(--grid); border-top: 1px solid var(--grid); }
.rolechip { display: inline-block; font-size: 10.5px; font-weight: 650; letter-spacing: 0.04em;
            text-transform: uppercase; padding: 1px 8px; border-radius: 999px; margin-bottom: 8px; }
.rolechip.user { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.rolechip.agent { color: var(--text-secondary); background: color-mix(in srgb, var(--muted) 18%, transparent); }
.modelchip { display: inline-flex; align-items: center; vertical-align: middle; gap: 5px;
             font-size: 10.5px; font-weight: 600; padding: 2px 9px 2px 7px;
             border-radius: 999px; margin: 0 0 8px 6px; color: var(--text-secondary);
             border: 1px solid var(--baseline); }
.modelchip i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.md { font: 13.5px/1.65 system-ui, sans-serif; }
.md p { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: break-word; max-width: 76ch; }
.md p:last-child, .md ul:last-child, .md ol:last-child, .md pre:last-child,
.md .md-table:last-child { margin-bottom: 0; }
.md pre { background: var(--page); border: 1px solid var(--grid); border-radius: 8px;
          padding: 10px 12px; margin: 0 0 10px; overflow-x: auto; }
.md pre code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: none; padding: 0; }
.md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em;
           background: color-mix(in srgb, var(--accent) 8%, transparent);
           padding: 1px 4px; border-radius: 4px; overflow-wrap: break-word; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; max-width: 72ch; }
.md li { margin: 2px 0; white-space: pre-wrap; overflow-wrap: break-word; }
.md .md-h1, .md .md-h2, .md .md-h3, .md .md-h4 { font-weight: 650; margin: 14px 0 6px; }
.md .md-h1 { font-size: 15px; } .md .md-h2 { font-size: 14px; }
.md .md-h3 { font-size: 13.5px; } .md .md-h4 { font-size: 13px; color: var(--text-secondary); }
.md hr { border: 0; border-top: 1px solid var(--grid); margin: 12px 0; }
.md .quote { border-left: 3px solid var(--baseline); padding-left: 10px; margin: 0 0 10px;
             color: var(--text-secondary); white-space: pre-wrap; max-width: 74ch; }
.md a { color: var(--accent); }
.md .md-table { overflow-x: auto; margin: 0 0 10px; }
.md table { border-collapse: collapse; width: max-content; min-width: 100%;
            font-size: 12.5px; font-variant-numeric: tabular-nums; }
.md th, .md td { text-align: left; vertical-align: top;
                 padding: 6px 18px 6px 0; overflow-wrap: break-word; }
.md th:last-child, .md td:last-child { padding-right: 0; }
.md th { font-weight: 650; white-space: nowrap; border-bottom: 2px solid var(--baseline); }
.md td { border-bottom: 1px solid var(--grid); }
.md tbody tr:last-child td { border-bottom: 0; }
.rawpre { white-space: pre-wrap; overflow-wrap: break-word; margin: 0;
          font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 8px 0; font-style: italic; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  padding: 9px 16px; border-radius: 8px; font-size: 13px; color: #fff;
  background: #333; opacity: 0; pointer-events: none; transition: opacity .18s; max-width: 90vw;
}
#toast.show { opacity: 1; }
#toast.err { background: var(--critical); }
#toast.ok { background: var(--good); }
#tip {
  position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface-1); border: 1px solid var(--baseline); border-radius: 6px;
  padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 9;
}
#tip.show { opacity: 1; }
#menu {
  position: fixed; z-index: 10; background: var(--surface-1);
  border: 1px solid var(--baseline); border-radius: 14px; padding: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.22); min-width: 160px; max-height: 60vh; overflow-y: auto;
}
#menu .menu-label { font-size: 11px; color: var(--muted); padding: 2px 8px 6px; }
#menu button { display: block; width: 100%; text-align: left; border: 0;
               background: transparent; padding: 6px 10px; border-radius: 8px; }
#menu button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
</style>
</head>
<body>
<header>
  <h1>mh — checkpoint map</h1>
  <span class="badge warn" id="robadge" hidden>read-only</span>
  <span class="hub" id="hubpath"></span>
  <span class="muted" id="current" style="font-size:12px"></span>
  <span class="spacer"></span>
  <label class="muted" style="font-size:12px">budget
    <input type="number" id="budget" min="0" step="500"
           style="width:90px;display:inline-block;margin-left:6px">
  </label>
  <button id="newckpt" class="mint">+ checkpoint</button>
  <button id="reload">refresh</button>
</header>

<main>
  <p class="tagline">Everything your sessions learned, one checkpoint at a time.</p>
  <section>
    <h2>Timeline</h2>
    <div class="mapwrap"><svg id="map" role="img" aria-label="Checkpoint timeline"></svg></div>
    <div class="legend">
      <span><i class="key" style="background:var(--accent)"></i> in the next <code>mh load</code></span>
      <span><i class="key" style="background:var(--neutral-mark)"></i> not loaded</span>
      <span><i class="key" style="background:transparent;border:2px solid var(--text-primary)"></i> current pointer</span>
      <span class="muted">arc = link (loads together) · node size = sessions</span>
    </div>
  </section>

  <section id="ckptsec" hidden>
    <h2 id="ckpttitle"></h2>
    <div class="row" style="margin-bottom:12px" id="ckactions">
      <button id="ck-rename">rename</button>
      <button id="ck-link">link to…</button>
      <button id="ck-unlink">unlink…</button>
      <span class="spacer" style="flex:1"></span>
      <button id="ck-delete" class="danger">delete checkpoint</button>
    </div>
    <div id="sessions"></div>
  </section>

  <section id="sessec" hidden>
    <h2 id="sestitle"></h2>
    <div id="exchanges"></div>
  </section>
</main>

<div id="toast"></div>
<div id="tip"></div>

<script id="mh-config" type="application/json">{}</script>
<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
// Server-injected config; the empty-object fallback keeps the page sane if it
// is ever opened as a plain file.
const CFG = { budget: 6000, readOnly: false, hub: "", version: "",
              ...JSON.parse($("mh-config").textContent || "{}") };
const RO = !!CFG.readOnly;
let DATA = null, SEL_CK = null;

function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show " + (kind || "");
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = ""), 3200);
}

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { "X-Mh-Token": TOKEN, "Content-Type": "application/json" },
  });
  const data = await res.json().catch(() => ({ error: "bad response" }));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

// Every mutation is the same shape: POST, report, re-read the hub, maybe reopen a
// pane. Written out per call site it drifted — one site had no catch at all.
async function act(path, body, okMsg, after) {
  try {
    const r = await post(path, body);
    toast(typeof okMsg === "function" ? okMsg(r) : okMsg, "ok");
    await refresh();
    if (after) after(r);
  } catch (e) { toast(e.message, "err"); }
}

// a small anchored popover of choices — click one, or dismiss with Esc /
// a click anywhere else (typing a slug into prompt() was a typo machine)
function closeMenu() {
  const m = $("menu");
  if (m) m.remove();
  removeEventListener("click", onMenuDismiss, true);
  removeEventListener("keydown", onMenuKey, true);
}
function onMenuDismiss(e) {
  const m = $("menu");
  if (m && !m.contains(e.target)) closeMenu();
}
function onMenuKey(e) { if (e.key === "Escape") closeMenu(); }
function menu(anchor, label, options, emptyMsg, onPick) {
  closeMenu();
  if (!options.length) { toast(emptyMsg, "err"); return; }
  const m = el("div", { id: "menu" }, el("div", { class: "menu-label", text: label }));
  options.forEach((o) => m.appendChild(el("button", { text: o, onclick: (e) => {
    e.stopPropagation(); closeMenu(); onPick(o);
  } })));
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + "px";
  setTimeout(() => {  // defer, or the opening click dismisses it instantly
    addEventListener("click", onMenuDismiss, true);
    addEventListener("keydown", onMenuKey, true);
  }, 0);
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;      // all user data goes through here
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) n.appendChild(kid);
  return n;
}
const svg = (tag, props) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  return n;
};

// --- markdown-lite, built entirely from DOM nodes (never innerHTML) --------
// Dialog is markdown; showing it raw made every session a wall of asterisks.
// This renders the safe common subset — fences, headings, lists, quotes,
// `code`, **bold**, links — and leaves anything else exactly as typed.

function inline(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) frag.appendChild(el("code", { text: m[1].slice(1, -1) }));
    else if (m[2]) frag.appendChild(el("strong", { text: m[2].slice(2, -2) }));
    else frag.appendChild(el("a", { text: m[3], href: m[4], target: "_blank", rel: "noopener noreferrer" }));
    last = re.lastIndex;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

// One row of a pipe table: split on unescaped |, drop the optional outer pipes.
function cells(line) {
  const out = [];
  let cur = "";
  for (let k = 0; k < line.length; k++) {
    if (line[k] === "\\" && line[k + 1] === "|") { cur += "|"; k++; }
    else if (line[k] === "|") { out.push(cur); cur = ""; }
    else cur += line[k];
  }
  out.push(cur);
  if (!out[0].trim()) out.shift();
  if (out.length && !out[out.length - 1].trim()) out.pop();
  return out.map((c) => c.trim());
}

function md(text) {
  const root = el("div", { class: "md" });
  const lines = String(text).split("\n");
  let i = 0, para = [];
  const flushP = () => {
    if (!para.length) return;
    const p = el("p", {});
    p.appendChild(inline(para.join("\n")));
    root.appendChild(p);
    para = [];
  };
  while (i < lines.length) {
    const line = lines[i];
    const f = line.match(/^\s*(```|~~~)/);
    if (f) {  // fenced code: verbatim, same token closes (as in curate.py)
      flushP();
      const token = f[1], buf = [];
      i++;
      while (i < lines.length && !lines[i].trimStart().startsWith(token)) { buf.push(lines[i]); i++; }
      if (i < lines.length) i++;  // the closing fence
      const pre = el("pre", {});
      pre.appendChild(el("code", { text: buf.join("\n") }));
      root.appendChild(pre);
      continue;
    }
    const h = line.match(/^(#{1,4}) +(.*)$/);
    if (h) {
      flushP();
      const d = el("div", { class: "md-h" + h[1].length });
      d.appendChild(inline(h[2]));
      root.appendChild(d);
      i++; continue;
    }
    // a pipe table, only when the second line is a real delimiter row of the
    // same width — otherwise prose with a stray | stays a paragraph
    if (line.includes("|") && i + 1 < lines.length) {
      const head = cells(line), delim = cells(lines[i + 1]);
      if (head.length && head.length === delim.length &&
          delim.every((c) => /^:?-+:?$/.test(c))) {
        flushP();
        const aligns = delim.map((c) => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right")
                                      : c.startsWith(":") ? "left" : null);
        const cellEl = (tag, text, k) => {
          const n = el(tag, aligns[k] ? { style: "text-align:" + aligns[k] } : {});
          n.appendChild(inline(text));
          return n;
        };
        const rowEl = (tag, vals) => {
          const tr = el("tr", {});
          head.forEach((_, k) => tr.appendChild(cellEl(tag, vals[k] || "", k)));
          return tr;
        };
        const table = el("table", {});
        table.appendChild(el("thead", {}, rowEl("th", head)));
        const body = el("tbody", {});
        i += 2;
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
          body.appendChild(rowEl("td", cells(lines[i])));  // short rows pad, long ones clip
          i++;
        }
        table.appendChild(body);
        root.appendChild(el("div", { class: "md-table" }, table));
        continue;
      }
    }
    if (/^\s*-{3,}\s*$/.test(line)) { flushP(); root.appendChild(el("hr")); i++; continue; }
    if (/^> ?/.test(line)) {
      flushP();
      const qb = [];
      while (i < lines.length && /^> ?/.test(lines[i])) { qb.push(lines[i].replace(/^> ?/, "")); i++; }
      const d = el("div", { class: "quote" });
      d.appendChild(inline(qb.join("\n")));
      root.appendChild(d);
      continue;
    }
    const ordered = /^\s*\d+[.)] +/.test(line);
    const itemRe = /^\s*[-*+] +/.test(line) ? /^\s*[-*+] +(.*)$/
                 : ordered ? /^\s*\d+[.)] +(.*)$/ : null;
    if (itemRe) {
      flushP();
      const listEl = el(ordered ? "ol" : "ul", {});
      let item = null;
      while (i < lines.length) {
        const m2 = lines[i].match(itemRe);
        if (m2) {
          item = el("li", {});
          item.appendChild(inline(m2[1]));
          listEl.appendChild(item);
          i++;
        } else if (item && /^\s+\S/.test(lines[i])) {  // continuation line
          item.appendChild(document.createTextNode("\n" + lines[i].trim()));
          i++;
        } else break;
      }
      root.appendChild(listEl);
      continue;
    }
    if (!line.trim()) { flushP(); i++; continue; }
    para.push(line);
    i++;
  }
  flushP();
  return root;
}

function tip(evt, lines) {
  const t = $("tip");
  t.textContent = "";
  lines.forEach((l) => t.appendChild(el("div", { text: l })));
  t.className = "show";
  const pad = 14;
  t.style.left = Math.min(evt.clientX + pad, innerWidth - t.offsetWidth - 8) + "px";
  t.style.top = Math.max(8, evt.clientY - t.offsetHeight - pad) + "px";
}
const untip = () => ($("tip").className = "");

// --- the map ---------------------------------------------------------------

function drawMap() {
  const host = $("map");
  host.textContent = "";
  const cps = DATA.checkpoints;
  if (!cps.length) {
    host.setAttribute("height", 40);
    host.appendChild(svg("text", { x: 4, y: 22, fill: "var(--muted)",
      text: "no checkpoints yet — create one to begin" }));
    return;
  }
  const loadedSet = new Set(DATA.load.loaded);
  const inPack = new Set(DATA.load.included.map((id) => id.split("/")[0]));
  const step = Math.max(120, Math.min(200, 900 / cps.length));
  const padX = 60, arcRoom = 26 + Math.min(cps.length, 6) * 11;
  const W = padX * 2 + step * (cps.length - 1);
  const axisY = arcRoom + 46, H = axisY + 78;
  host.setAttribute("width", Math.max(W, 320));
  host.setAttribute("height", H);

  const x = (i) => padX + i * step;
  const idx = new Map(cps.map((c, i) => [c.slug, i]));
  const maxSessions = Math.max(1, ...cps.map((c) => c.sessions.length));
  const r = (c) => 8 + 12 * Math.sqrt(c.sessions.length / maxSessions);

  host.appendChild(svg("line", { x1: padX - 30, y1: axisY, x2: W - padX + 30, y2: axisY,
    stroke: "var(--baseline)", "stroke-width": 2 }));

  // link arcs, drawn first so nodes sit above them
  DATA.links.forEach(([a, b], k) => {
    if (!idx.has(a) || !idx.has(b)) return;
    const i = idx.get(a), j = idx.get(b);
    const x1 = x(Math.min(i, j)), x2 = x(Math.max(i, j));
    const lift = 22 + 11 * (k % 6);
    const path = svg("path", {
      d: `M ${x1} ${axisY - 12} Q ${(x1 + x2) / 2} ${axisY - 12 - lift * 2} ${x2} ${axisY - 12}`,
      fill: "none", stroke: "var(--accent)", "stroke-width": 2, opacity: 0.55,
    });
    path.addEventListener("mousemove", (e) => tip(e, [`link: ${a} — ${b}`, "these load together"]));
    path.addEventListener("mouseleave", untip);
    host.appendChild(path);
  });

  cps.forEach((c, i) => {
    const active = inPack.has(c.slug) || (loadedSet.has(c.slug) && DATA.load.included.length === 0);
    const g = svg("g", { style: "cursor:pointer" });
    // generous hit target, independent of mark size
    g.appendChild(svg("circle", { cx: x(i), cy: axisY, r: 26, fill: "transparent" }));
    g.appendChild(svg("circle", {
      cx: x(i), cy: axisY, r: r(c),
      fill: active ? "var(--accent)" : "var(--neutral-mark)",
      stroke: "var(--surface-1)", "stroke-width": 2,
    }));
    if (c.slug === DATA.current) {
      g.appendChild(svg("circle", { cx: x(i), cy: axisY, r: r(c) + 5, fill: "none",
        stroke: "var(--text-primary)", "stroke-width": 2 }));
      g.appendChild(svg("text", { x: x(i), y: axisY + r(c) + 34, "text-anchor": "middle",
        fill: "var(--text-primary)", "font-weight": "650", text: "current" }));
    }
    g.appendChild(svg("text", { x: x(i), y: axisY + r(c) + 20, "text-anchor": "middle",
      fill: "var(--text-primary)", "font-weight": "600", text: c.slug }));
    g.appendChild(svg("text", { x: x(i), y: axisY - r(c) - 10, "text-anchor": "middle",
      fill: "var(--muted)", text: c.created.slice(0, 10) }));
    const toks = c.sessions.reduce((s, x) => s + x.tokens, 0);
    g.addEventListener("mousemove", (e) => tip(e, [
      c.slug,
      `${c.sessions.length} session${c.sessions.length === 1 ? "" : "s"} · ~${toks} tokens`,
      active ? "included in the next mh load" : "not in the next mh load",
    ]));
    g.addEventListener("mouseleave", untip);
    g.addEventListener("click", () => selectCheckpoint(c.slug));
    host.appendChild(g);
  });
}

// --- checkpoint panel ------------------------------------------------------

// bright HEY-style avatar circles: deterministic color from the session key
const AVATARS = ["#f5d652", "#f2846b", "#c7e86b", "#7fd8f5", "#c9b8f9", "#8fe3b0"];
function avatarColor(key) {
  let h = 0;
  for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATARS[h % AVATARS.length];
}
function sessionKey(file) {
  return file.slice(16).replace(/\.md$/, "");
}
function initialsFor(file) {
  const key = sessionKey(file);
  if (key.startsWith("pi-")) return "PI";
  if (key.startsWith("cx-")) return "CX";
  return (key.slice(0, 2) || "??").toUpperCase();
}
// "claude-sonnet-4-5-20250929" -> "Sonnet 4.5". Anything mh does not recognise
// is shown exactly as the session file records it — a raw id is short and
// honest, and inventing a pretty name for an unknown model would not be.
const FAMILIES = ["opus", "sonnet", "haiku", "fable", "mythos"];
function modelLabel(id) {
  const s = id.toLowerCase()
    .replace(/^[a-z]{2}\.anthropic\.|^anthropic[./]/, "")  // us.anthropic.claude-…
    .replace(/-v\d+:\d+$/, "")                             // bedrock -v1:0
    .replace(/[-@]\d{8}$/, "");                            // dated snapshots
  const m = s.match(/^claude-(?:(\d+)(?:-(\d+))?-)?([a-z]+)(?:-(\d+)(?:-(\d+))?)?$/);
  if (!m) return id;
  const [, preMajor, preMinor, family, postMajor, postMinor] = m;
  const major = preMajor || postMajor, minor = preMinor || postMinor;
  if (!major || !FAMILIES.includes(family)) return id;
  return family[0].toUpperCase() + family.slice(1) + " " + major + (minor ? "." + minor : "");
}

function modelChip(id) {
  const chip = el("span", { class: "modelchip", title: id });  // raw id on hover
  const dot = el("i", {});
  dot.style.background = avatarColor(id);
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(modelLabel(id)));
  return chip;
}

function niceStamp(file) {
  const s = file.slice(0, 15);  // YYYY-MM-DD_HHMM
  return `${s.slice(0, 10)} ${s.slice(11, 13)}:${s.slice(13, 15)}`;
}

function selectCheckpoint(slug) {
  SEL_CK = slug;
  $("sessec").hidden = true;
  const c = DATA.checkpoints.find((x) => x.slug === slug);
  if (!c) { $("ckptsec").hidden = true; return; }
  $("ckptsec").hidden = false;
  $("ckpttitle").textContent = `${c.slug} · created ${c.created.replace("_", " ")}`;
  const omitted = new Set(DATA.load.omitted);
  const list = $("sessions");
  list.textContent = "";
  if (!c.sessions.length) {
    list.appendChild(el("div", { class: "empty",
      text: "Nothing here yet — this checkpoint is waiting for its first session." }));
  }
  c.sessions.forEach((s) => {
    const av = el("div", { class: "avatar", text: initialsFor(s.file) });
    av.style.background = avatarColor(sessionKey(s.file));
    const title = el("div", { class: "stitle", text: niceStamp(s.file) },
      el("span", { class: "key", text: "‹" + sessionKey(s.file) + "›" }));
    if (omitted.has(s.id)) title.appendChild(el("span", { class: "badge", text: "over budget" }));
    if (s.compacted) title.appendChild(el("span", { class: "badge", text: "compacted" }));
    if (s.legacy) title.appendChild(el("span", { class: "badge", text: "Q&A format" }));
    if (!s.editable && !s.compacted) title.appendChild(el("span", { class: "badge warn", text: "read-only" }));
    // a compacted session summarises N exchanges but stores none: "0" would read as empty
    const meta = (s.compacted || s.exchanges === null)
      ? `~${s.tokens} tokens` : `${s.exchanges} exch. · ~${s.tokens} tokens`;
    const row = el("div", { class: "srow" },
      av,
      el("div", { class: "smain" },
        title,
        el("div", { class: "spreview", text: meta + (s.preview ? " — " + s.preview : "") })),
      RO ? null :
        el("div", { class: "sacts" },
          el("button", { text: "move…",
            onclick: (e) => { e.stopPropagation(); moveSession(s, e.currentTarget); } }),
          el("button", { class: "danger", text: "delete",
            onclick: (e) => { e.stopPropagation(); deleteSession(s); } })));
    row.addEventListener("click", () => openSession(c.slug, s.file));
    list.appendChild(row);
  });
}

// --- session panel ---------------------------------------------------------

async function openSession(slug, file) {
  SEL_CK = slug;
  const data = await api(`/api/session?ckpt=${encodeURIComponent(slug)}&file=${encodeURIComponent(file)}`);
  $("sessec").hidden = false;
  $("sestitle").textContent = `${data.checkpoint} / ${data.file}` +
    (data.editable && !RO ? "" : "  — read-only");
  const host = $("exchanges");
  host.textContent = "";
  if (!data.editable) {
    host.appendChild(el("p", { class: "empty", text: data.reason || "not editable" }));
  }
  if (data.raw) {
    // compacted: a summary in markdown, render it; unknown format: verbatim,
    // pretending to know its shape would misrender it
    const card = el("div", { class: "ex" });
    card.appendChild(el("header", {}, el("span", { class: "role",
      text: data.compacted ? "compacted summary" : "raw file" })));
    const body = el("div", { class: "turn" });
    body.appendChild(data.compacted ? md(data.raw) : el("pre", { class: "rawpre", text: data.raw }));
    card.appendChild(body);
    host.appendChild(card);
  }
  if (data.legacy && data.editable) {
    host.appendChild(el("p", { class: "muted",
      text: "This session is in the old Q&A format. Editing it rewrites the file in the current User/Agent format." }));
  }
  data.exchanges.forEach((ex) => host.appendChild(exchangeCard(data, ex)));
  $("sessec").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function exchangeCard(data, ex) {
  const card = el("div", { class: "ex" });
  const head = el("header", {},
    el("span", { class: "role", text: "exchange " + ex.index }),
    el("span", { class: "spacer" }));
  if (data.editable && !RO) {
    head.appendChild(el("button", { text: "edit", onclick: () => editCard(card, data, ex) }));
    head.appendChild(el("button", { class: "danger", text: "delete", onclick: () => {
      if (!confirm(`Delete exchange ${ex.index}? The hub keeps it in git history.`)) return;
      act("/api/exchange/delete", { ckpt: data.checkpoint, file: data.file, index: ex.index },
        `deleted exchange ${ex.index}`, () => openSession(data.checkpoint, data.file));
    } }));
  }
  card.appendChild(head);
  const user = el("div", { class: "turn user" },
    el("span", { class: "rolechip user", text: "User" }));
  user.appendChild(md(ex.user));
  card.appendChild(user);
  const agent = el("div", { class: "turn agent" },
    el("span", { class: "rolechip agent", text: "Agent" }));
  // one chip per model, for the rare turn a model switch straddles
  for (const m of String(ex.model || "").split(", ")) if (m) agent.appendChild(modelChip(m));
  if (ex.agent) agent.appendChild(md(ex.agent));
  else agent.appendChild(el("p", { class: "empty", text: "(no textual reply captured)" }));
  card.appendChild(agent);
  return card;
}

function editCard(card, data, ex) {
  card.textContent = "";
  card.appendChild(el("header", {}, el("span", { class: "role", text: "editing exchange " + ex.index })));
  const u = el("textarea"); u.value = ex.user;
  const a = el("textarea"); a.value = ex.agent;
  const wrap = el("div", { style: "padding:10px 12px" });
  wrap.appendChild(el("div", { class: "role", style: "margin-bottom:4px", text: "User" }));
  wrap.appendChild(u);
  wrap.appendChild(el("div", { class: "role", style: "margin:10px 0 4px", text: "Agent" }));
  wrap.appendChild(a);
  wrap.appendChild(el("div", { class: "row end", style: "margin-top:10px" },
    el("button", { text: "cancel", onclick: () => openSession(data.checkpoint, data.file) }),
    el("button", { class: "primary", text: "save", onclick: () =>
      act("/api/exchange/edit",
        { ckpt: data.checkpoint, file: data.file, index: ex.index, user: u.value, agent: a.value },
        `rewrote exchange ${ex.index}`, () => openSession(data.checkpoint, data.file)) })));
  card.appendChild(wrap);
}

// --- mutations -------------------------------------------------------------

const otherCheckpoints = () => DATA.checkpoints.map((c) => c.slug).filter((x) => x !== SEL_CK);

function deleteSession(s) {
  if (!confirm(`Delete session ${s.file}? The hub keeps it in git history.`)) return;
  $("sessec").hidden = true;
  act("/api/session/delete", { ckpt: SEL_CK, file: s.file }, "session deleted");
}

function moveSession(s, anchor) {
  menu(anchor, `move ${s.file} to…`, otherCheckpoints(),
    "no other checkpoint to move into", (to) => {
      $("sessec").hidden = true;
      act("/api/session/move", { ckpt: SEL_CK, file: s.file, to }, `moved to ${to}`);
    });
}

function wire() {
  $("reload").onclick = $("budget").onchange = () => refresh();
  $("newckpt").onclick = () => {
    const name = prompt("New checkpoint name:");
    if (name) act("/api/checkpoint/create", { name }, "checkpoint created");
  };
  $("ck-rename").onclick = () => {
    const name = prompt("Rename checkpoint to:", SEL_CK);
    if (!name || name === SEL_CK) return;
    $("sessec").hidden = true;
    act("/api/checkpoint/rename", { slug: SEL_CK, name },
      (r) => `renamed to ${r.slug}`, (r) => { SEL_CK = r.slug; selectCheckpoint(SEL_CK); });
  };
  $("ck-delete").onclick = () => {
    const c = DATA.checkpoints.find((x) => x.slug === SEL_CK);
    if (!confirm(`Delete checkpoint ${SEL_CK} and its ${c.sessions.length} session(s)?\n\nThe hub keeps everything in git history.`)) return;
    SEL_CK = null; $("ckptsec").hidden = true; $("sessec").hidden = true;
    act("/api/checkpoint/delete", { slug: c.slug }, "checkpoint deleted");
  };
  $("ck-link").onclick = () =>
    menu($("ck-link"), `link ${SEL_CK} with…`, otherCheckpoints(),
      "nothing to link to", (b) => act("/api/link", { a: SEL_CK, b }, "linked"));
  $("ck-unlink").onclick = () => {
    const partners = DATA.links.filter((e) => e.includes(SEL_CK)).map((e) => (e[0] === SEL_CK ? e[1] : e[0]));
    menu($("ck-unlink"), `unlink ${SEL_CK} from…`, partners,
      "no links on this checkpoint", (b) => act("/api/unlink", { a: SEL_CK, b }, "unlinked"));
  };
}

async function refresh() {
  const budget = $("budget").value;
  DATA = await api("/api/map?budget=" + encodeURIComponent(budget === "" ? "none" : budget));
  $("current").textContent = DATA.current ? "current: " + DATA.current : "no current checkpoint";
  if (DATA.load.error) toast(DATA.load.error, "err");
  drawMap();
  if (SEL_CK && !DATA.checkpoints.some((c) => c.slug === SEL_CK)) {
    SEL_CK = null; $("ckptsec").hidden = true; $("sessec").hidden = true;
  }
  // an invariant of refreshing, not something each call site must remember
  if (SEL_CK) selectCheckpoint(SEL_CK);
}

wire();
$("budget").value = CFG.budget ?? "";
$("hubpath").textContent = CFG.hub;
if (CFG.version) document.title += " · v" + CFG.version;
if (RO) {
  $("robadge").hidden = false;
  $("newckpt").hidden = true;
  $("ckactions").hidden = true;
}
refresh().catch((e) => toast(e.message, "err"));
</script>
</body>
